    var html = '<h3>Wartet auf das Sheet</h3>'
      + '<p class="q-hinweis">' + queue.length + (queue.length===1?" Änderung ist":" Änderungen sind")
      + ' noch nicht im Google Sheet. Sie gehen der Reihe nach raus — der erste blockiert die übrigen.</p>'
      + '<div class="q-liste">'
      + queue.map(function(j,i){
          var v = (j.versuche||0) > 0 ? '<span class="q-v">' + j.versuche + " Versuche</span>" : "";
          return '<div class="q-zeile' + (i===0?" erste":"") + '">' + esc(jobText(j)) + v + '</div>';
        }).join("")
      + '</div>'
      + '<button class="wide del" id="qWeg">Alle verwerfen</button>';
    openSheet(html);
    var w = document.getElementById("qWeg");
    if (w) w.addEventListener("click", function(){
      if (!confirm("Alle " + queue.length + " wartenden Änderungen verwerfen? Sie gehen dann verloren."))
        return;
      queue.length = 0; queueSave(); queueAnzeige(); closeSheet();
      snack("Warteschlange geleert");
    });
  }

  function idFeld_(tab){
    return tab === TAB_COMMENTS  ? "comment_id"
         : tab === TAB_RECURRING ? "series_id"
         : tab === TAB_ACTIVITY  ? "activity_id" : "id";
  }
  /* Vor einem zweiten Anlauf beim Anhaengen pruefen, ob die Zeile schon
     drin ist — sonst entstehen bei verlorener Antwort Dubletten. */
  async function zeileSchonDa_(job){
    try {
      var f = idFeld_(job.tab), wert = job.row && job.row[f];
      if (!wert) return false;
      var rows = await readTab(job.tab);
      return Array.isArray(rows) && rows.some(function(r){ return String(r[f]) === String(wert); });
    } catch(e){ return false; }
  }
  var queueTimer = null;
  function enqueue(job){
    job.versuche = 0;
    queue.push(job); queueSave(); queueAnzeige();
    // Kurz warten, damit die Auftraege EINER Aktion zusammenkommen und in einen
    // Aufruf passen. Gemessen: das Skript braucht 1-3s, die Umleitung davor aber
    // 5-50s — und die faellt pro Aufruf an, nicht pro Zeile.
    clearTimeout(queueTimer);
    queueTimer = setTimeout(queueRun, 60);
    return Promise.resolve({ ok:true, wartet:true });
  }
  function jobZuOp(job){
    var o = { action: job.action, tab: job.tab };
    if (job.row) o.row = job.row;
    if (job.idField){ o.idField = job.idField; o.idValue = job.idValue; }
    if (job.grp) o.grp = job.grp;
    return o;
  }
  // Nur auf Zeit merken: sonst bliebe die App nach einer spaeteren Bereitstellung
  // fuer immer bei Einzelaufrufen, ohne erkennbaren Grund.
  var buendelGeht = true;
  try {
    var ausSeit = Number(localStorage.getItem("board-batchwrite-aus") || 0);
    buendelGeht = !ausSeit || (Date.now() - ausSeit > 6*60*60*1000);
  } catch(e){}
  /* Mehrere Auftraege in EINEM Aufruf. Die Dublettensicherung bleibt bestehen:
     jeder Auftrag traegt weiter "abgeschickt", und beim Wiederholen prueft
     zeileSchonDa_, ob die Zeile inzwischen doch angekommen ist. */
  async function buendelVersuch(){
    var gruppe = queue.slice(0, 25), zeichen = 0, i;
    for (i = 0; i < gruppe.length; i++){
      zeichen += JSON.stringify(jobZuOp(gruppe[i])).length;
      if (i && zeichen > 60000){ gruppe = gruppe.slice(0, i); break; }
    }
    if (gruppe.length < 2) return false;
    gruppe.forEach(function(j){ j.abgeschickt = true; }); queueSave();
    var d;
    try { d = await apiCall({ action:"batch", ops: gruppe.map(jobZuOp) }); }
    catch(e){
      var txt = (e && e.message) || String(e);
      if (e && e.endgueltig && /unknown action/i.test(txt)){
        // Das Skript kennt "batch" noch nicht — ab jetzt einzeln, einmal merken
        buendelGeht = false;
        try { localStorage.setItem("board-batchwrite-aus", String(Date.now())); } catch(_){}
        return false;
      }
      throw e;                       // alles andere behandelt queueRun wie bisher
    }
    if (!d || !Array.isArray(d.results) || d.results.length !== gruppe.length)
      throw new Error("Das Bündel kam unvollständig zurück");
    var stehengeblieben = null;
    for (i = 0; i < gruppe.length; i++){
      var r = d.results[i] || {};
      if (r.ok){ continue; }
      stehengeblieben = r.error || "Übersprungen, weil ein zusammengehöriger Schritt fehlschlug";
      break;                          // ab hier nichts abraeumen, Reihenfolge muss stehen
    }
    var fertig = (stehengeblieben === null) ? gruppe.length : i;
    queue.splice(0, fertig); queueSave(); queueAnzeige();
    if (stehengeblieben !== null){
      var j = queue[0];
      if (j) j.versuche = (j.versuche || 0) + 1;
      queue.shift(); queueSave(); queueAnzeige();
      var m = /Zeile nicht gefunden/i.test(stehengeblieben) ? "Der Eintrag existiert nicht mehr" : stehengeblieben;
      snack("Nicht gespeichert: " + m, null, true);
    }
    return true;
  }

  async function queueRun(){
    if (queueLaeuft || !queue.length) return;
    queueLaeuft = true;
    while (queue.length){
      if (buendelGeht){
        try { if (await buendelVersuch()) continue; }
        catch(e){
          // Wie im Einzelzweig: was endgueltig gescheitert ist, wird verworfen.
          // Ohne diese Pruefung lief ein solcher Auftrag alle 30 Sekunden
          // erneut und blockierte alles dahinter — der Zaehler oben wuchs
          // dann immer weiter und ging nie zurueck.
          if (e && e.endgueltig){
            var kaputt = queue.shift(); queueSave(); queueAnzeige();
            var txt = (e && e.message) || String(e);
            if (/Zeile nicht gefunden/i.test(txt)) txt = "Der Eintrag existiert nicht mehr";
            snack("Nicht gespeichert: " + txt, null, true);
            continue;
          }
          queue[0].versuche = (queue[0].versuche || 0) + 1; queueSave();
          setTimeout(function(){ queueLaeuft = false; queueRun(); },
                     Math.min(30000, 2000 * queue[0].versuche));
          return;
        }
      }
      var job = queue[0];
      try {
        // Vor jedem zweiten Anlauf pruefen, ob die Zeile schon drin ist. "abgeschickt"
        // steht auch dann noch, wenn die App mitten im Schreiben beendet wurde — sonst
        // liefe der Auftrag beim naechsten Start als vermeintlich neu erneut durch.
        if (job.action === "append" && (job.versuche > 0 || job.abgeschickt) && await zeileSchonDa_(job)){
          // war schon angekommen — nicht noch einmal anhaengen
        } else {
          var params = { action:job.action, tab:job.tab };
          if (job.row) params.row = job.row;
          if (job.idField) { params.idField = job.idField; params.idValue = job.idValue; }
          job.abgeschickt = true; queueSave();      // merken, BEVOR es rausgeht
          await apiCall(params);
        }
        queue.shift(); queueSave(); queueAnzeige();
      } catch(e){
        job.versuche++;
        if (e && e.endgueltig){
          // Wiederholen hilft nicht (z. B. zu lang, Tab fehlt) — verwerfen und melden
          queue.shift(); queueSave(); queueAnzeige();
          var txt = (e && e.message) || String(e);
          if (/Zeile nicht gefunden/i.test(txt)) txt = "Der Eintrag existiert nicht mehr";
          snack("Nicht gespeichert: " + txt, null, true);
          continue;
        }
        queueSave();
        // Sperre bleibt gesetzt, bis die Wiederholung laeuft — sonst startet
        // ein neuer Schreibvorgang in der Zwischenzeit einen zweiten Lauf.
        setTimeout(function(){ queueLaeuft = false; queueRun(); },
                   Math.min(30000, 2000 * job.versuche));
        return;
      }
    }
    queueLaeuft = false;
    queueAnzeige();
  }

  /* grp (optional): Vorgaenge, die zusammen gelingen oder zusammen ausbleiben
     muessen. Beim Erledigen sind das "nach Done anhaengen" und "aus Tickets
     loeschen" — liefe das Loeschen trotz misslungenem Anhaengen, waere das
     Ticket nirgends mehr. Das ist schlimmer als eine Dublette. */
  function appendRow(tab,row,grp){ return enqueue({ action:"append", tab:tab, row:row, grp:grp }); }
  function updateRow(tab,idField,idValue,row,grp){ return enqueue({ action:"update", tab:tab, idField:idField, idValue:idValue, row:row, grp:grp }); }
  function deleteRows(tab,idField,idValue,grp){ return enqueue({ action:"delete", tab:tab, idField:idField, idValue:idValue, grp:grp }); }

  /* =====================================================================
     Hilfsfunktionen — wortgleich aus dem Desktop-Board uebernommen,
     damit beide Clients exakt dieselben Daten schreiben
     ===================================================================== */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function todayISO(){ return toISO(new Date()); }
  function parseISO(s){ if(!s) return null; var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function addDays(iso,n){ var d=parseISO(iso)||new Date(); d.setDate(d.getDate()+n); return toISO(d); }
  function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  function normTs(v){ var n=Number(v); return isFinite(n)&&v!=="" ? n : (Date.parse(v)||Date.now()); }
  function normDate(v){
    if (v === null || v === undefined) return "";
    var s = String(v).trim(); if (!s) return "";
    var m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+"-"+m[2]+"-"+m[3];
    if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/))) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
    var MN = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };
    if ((m = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\b/)) && MN[m[1]])
      return m[3]+"-"+String(MN[m[1]]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
    var d = new Date(s);
    return isNaN(d.getTime()) ? "" : toISO(d);
  }
  function ticketToRow(t){
    return { id:t.id, title:t.title, dueDate:t.dueDate, status:t.status,
             tags:(t.tags||[]).join(","), priority:t.priority||"",
             description:t.description||"", series_id:t.series_id||"" };
  }
  function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var WD_SHORT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  function fmtDue(iso){
    if (!iso) return "Kein Datum";
    var d = parseISO(iso); if (!d) return "Kein Datum";
    var diff = daysBetween(parseISO(todayISO()), d);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Morgen";
    if (diff === -1) return "Gestern";
    var s = WD_SHORT[d.getDay()] + ", " + String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ".";
    return (diff < -1) ? s + " (" + Math.abs(diff) + " T. über)" : s;
  }
  /* Kurzform fuer die Liste — dort muss die graue Zeile einzeilig bleiben,
     sonst zerfaellt der Rhythmus. Das lange Format steht weiter im Detail. */
  function fmtDueKurz(iso){
    if (!iso) return "Kein Datum";
    var d = parseISO(iso); if (!d) return "Kein Datum";
    var diff = daysBetween(parseISO(todayISO()), d);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Morgen";
    if (diff === -1) return "Gestern";
    if (diff < -1) return Math.abs(diff) + " Tage über";
    return WD_SHORT[d.getDay()] + ", " + String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ".";
  }
  function dueClass(iso){
    if (!iso) return "";
    var diff = daysBetween(parseISO(todayISO()), parseISO(iso));
    return diff < 0 ? "over" : (diff === 0 ? "today" : "");
  }
  function fmtWhen(ts){
    var d = new Date(ts), diff = daysBetween(parseISO(todayISO()), parseISO(toISO(d)));
    var time = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if (diff === 0) return "Heute, " + time;
    if (diff === -1) return "Gestern, " + time;
    return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear() + ", " + time;
  }

  /* =====================================================================
     Markdown <-> HTML — beide Richtungen aus dem Desktop-Board,
     damit Beschreibungen zwischen Mac und Handy verlustfrei bleiben
     ===================================================================== */
  // Nackte URLs im Text erkennen (gleiches Muster wie im Desktop)
  var URL_MUSTER = /(^|[\s(>])((?:https?:\/\/|www\.)[^\s<)]*[^\s<).,;:!?])/g;
  function mdInline(s){
    return s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
            .replace(/__([^_]+)__/g,"<u>$1</u>")
            .replace(/\*([^*\n]+)\*/g,"<em>$1</em>")
            .replace(/`([^`]+)`/g,"<code>$1</code>")
            .replace(/~~([^~]+)~~/g,"<del>$1</del>")
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
            .replace(URL_MUSTER, function(m, vor, url){
              // Nackte Adressen anklickbar machen; bereits gesetzte Links bleiben unberuehrt
              return vor + '<a href="' + (/^www\./i.test(url) ? "https://" + url : url)
                   + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
            });
  }
  function mdToHtml(text){
    var lines = esc(text||"").split(/\r?\n/), html = "", i = 0;
    function indentW(s){ return s.replace(/\t/g,"  ").length; }
    function parseList(indent){
      var type = /\d+\./.test(lines[i].match(/^(\s*)([-*]|\d+\.)\s+/)[2]) ? "ol" : "ul";
      html += "<" + type + ">";
      while (i < lines.length){
        var lm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (!lm) break;
        var ind = indentW(lm[1]);
        if (ind < indent) break;
        if (ind > indent){ parseList(ind); continue; }
        if ((/\d+\./.test(lm[2]) ? "ol" : "ul") !== type) break;
        html += "<li>" + mdInline(lm[3]);
        i++;
        if (i < lines.length){
          var nm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+/);
          if (nm && indentW(nm[1]) > indent) parseList(indentW(nm[1]));
        }
        html += "</li>";
      }
      html += "</" + type + ">";
    }
    while (i < lines.length){
      var line = lines[i], m;
      // Code-Zaun zuerst: alles dazwischen bleibt unangetastet
      if ((m = line.match(/^\s*```\s*([A-Za-z0-9+#._-]*)\s*$/))){
        var sprache = m[1] || "", inhalt = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])){ inhalt.push(lines[i]); i++; }
        if (i < lines.length) i++;                       // schliessenden Zaun ueberspringen
        html += '<pre class="code"' + (sprache ? ' data-lang="' + sprache + '"' : '')
              + '><code>' + inhalt.join("\n") + '</code></pre>';
        continue;
      }
      if ((m = line.match(/^\s*(#{1,3})\s+(.*)$/))){ html += "<h3>" + mdInline(m[2]) + "</h3>"; i++; continue; }
      if (line.match(/^(\s*)([-*]|\d+\.)\s+/)){ parseList(indentW(line.match(/^(\s*)/)[1])); continue; }
      if (line.trim() === ""){ html += "<div><br></div>"; i++; continue; }
      html += "<div>" + mdInline(line) + "</div>"; i++;
    }
    return html;
  }
  function htmlToMd(root){
    function inline(node){
      var s = "";
      node.childNodes.forEach(function(n){
        if (n.nodeType === 3){ s += n.nodeValue; return; }
        if (n.nodeType !== 1) return;
        var tag = n.nodeName.toLowerCase();
        if (tag === "br"){ s += "\n"; return; }
        var inner = inline(n);
        if (tag === "strong" || tag === "b") s += inner ? ("**"+inner+"**") : "";
        else if (tag === "em" || tag === "i") s += inner ? ("*"+inner+"*") : "";
        else if (tag === "u" || tag === "ins") s += inner ? ("__"+inner+"__") : "";
        else if (tag === "del" || tag === "s" || tag === "strike") s += inner ? ("~~"+inner+"~~") : "";
        else if (tag === "code") s += inner ? ("`"+inner+"`") : "";
        else if (tag === "a"){ var href = n.getAttribute("href")||""; s += href ? ("["+inner+"]("+href+")") : inner; }
        else if (tag === "span"){
          var st = (n.getAttribute("style")||"").toLowerCase(), x = inner;
          if (/underline/.test(st)) x = "__"+x+"__";
          if (/italic/.test(st)) x = "*"+x+"*";
          if (/bold|[6-9]00/.test(st)) x = "**"+x+"**";
          s += x;
        }
        else if (tag === "ul" || tag === "ol"){ /* Listen werden als Block behandelt */ }
        else s += inner;
      });
      return s;
    }
    var lines = [];
    function listBlock(node, ordered, depth){
      var pad = "  ".repeat(depth), idx = 1;
      [].slice.call(node.children).forEach(function(el){
        var t = el.nodeName.toLowerCase();
        if (t === "li"){
          lines.push(pad + (ordered ? (idx++)+". " : "- ") + inline(el).trim());
          [].slice.call(el.children).forEach(function(ch){
            var ct = ch.nodeName.toLowerCase();
            if (ct === "ul") listBlock(ch, false, depth+1);
            else if (ct === "ol") listBlock(ch, true, depth+1);
          });
        }
        else if (t === "ul") listBlock(el, false, depth+1);
        else if (t === "ol") listBlock(el, true, depth+1);
      });
    }
    function block(container){
      container.childNodes.forEach(function(n){
        if (n.nodeType === 3){ var t = n.nodeValue.replace(/\n+/g," "); if (t.trim()) lines.push(t); return; }
        if (n.nodeType !== 1) return;
        var tag = n.nodeName.toLowerCase();
        // Code-Block: Inhalt woertlich zurueckschreiben, nichts umformatieren
        if (tag === "pre"){
          var sprache = n.getAttribute("data-lang") || "";
          lines.push("```" + sprache);
          String(n.textContent || "").replace(/\n$/,"").split("\n").forEach(function(z){ lines.push(z); });
          lines.push("```");
          return;
        }
        if (/^h[1-6]$/.test(tag)){ var ht = inline(n).trim(); if (ht) lines.push("# " + ht); }
        else if (tag === "ul") listBlock(n, false, 0);
        else if (tag === "ol") listBlock(n, true, 0);
        else if (tag === "div" || tag === "p"){
          if (n.querySelector("ul,ol,div,p,h1,h2,h3,h4,h5,h6")) block(n);
          else lines.push(inline(n).replace(/\n+$/,""));
        }
        else if (tag === "br") lines.push("");
        else { var x = inline(n); if (x) lines.push(x); }
      });
    }
    block(root);
    return lines.join("\n").replace(/^\n+/,"").replace(/\n+$/,"");
  }

  /* =====================================================================
     Formatier-Editor — Text wird beim Tippen sofort formatiert dargestellt,
     gespeichert wird weiterhin Markdown (wie im Desktop-Board)
     ===================================================================== */
  function rteExec(cmd,val){
    try { document.execCommand("styleWithCSS", false, false); } catch(e){}
    document.execCommand(cmd, false, val || null);
  }
  function rteToggleBlock(ed, tag){
    try { document.execCommand("styleWithCSS", false, false); } catch(e){}
    var sel = window.getSelection(), n = sel.anchorNode, inHeading = false;
    while (n && n !== ed){ if (n.nodeType === 1 && /^h[1-6]$/i.test(n.nodeName)){ inHeading = true; break; } n = n.parentNode; }
    document.execCommand("formatBlock", false, inHeading ? "<div>" : "<"+tag+">");
  }
  function rteEnsureCaret(ed){
    var sel = window.getSelection();
    if (sel.rangeCount){ var n = sel.anchorNode; while (n){ if (n === ed) return; n = n.parentNode; } }
    var r = document.createRange();
    r.selectNodeContents(ed); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  /* Markdown-Kuerzel beim Tippen: "- ", "1. ", "# " am Zeilenanfang */
  function rteSpace(ed){
    var sel = window.getSelection(); if (!sel.rangeCount) return false;
    var r = sel.getRangeAt(0); if (!r.collapsed) return false;
    var before;
    try {
      var pre = r.cloneRange(), block = r.startContainer;
      if (block === ed) block = ed.childNodes[Math.max(0, r.startOffset-1)] || ed;
      while (block && block !== ed && block.parentNode && block.parentNode !== ed) block = block.parentNode;
      if (block && block !== ed && block.nodeType === 1) pre.setStart(block, 0); else pre.setStart(ed, 0);
      before = pre.toString();
    } catch(e){ return false; }
    var trigger = null;
    if (before === "#" || before === "##" || before === "###") trigger = "h";
    else if (before === "-" || before === "*" || before === "•") trigger = "ul";
    else if (/^\d+\.$/.test(before)) trigger = "ol";
    if (!trigger) return false;
    for (var i=0;i<before.length;i++) document.execCommand("delete", false, null);
    if (trigger === "ul") rteExec("insertUnorderedList");
    else if (trigger === "ol") rteExec("insertOrderedList");
    else rteToggleBlock(ed, "h3");
    return true;
  }
  function rtePlaceholder(ed){
    ed.classList.toggle("is-empty", !ed.textContent.trim() && !ed.querySelector("ul,ol,img"));
  }
  function rteSet(ed, md){ ed.innerHTML = md ? mdToHtml(md) : ""; rtePlaceholder(ed); }

  function initRTE(ed, opts){
    opts = opts || {};
    ed.classList.add("rte");
    ed.setAttribute("contenteditable", "true");
    if (opts.small) ed.classList.add("sm");
    if (opts.placeholder) ed.setAttribute("data-placeholder", opts.placeholder);
    try { document.execCommand("defaultParagraphSeparator", false, "div"); } catch(e){}


    ed.addEventListener("input", function(){
      rtePlaceholder(ed);
      if (opts.onInput) opts.onInput();
    });
    ed.addEventListener("keydown", function(e){
      if (e.key === " "){ try { if (rteSpace(ed)) e.preventDefault(); } catch(err){} }
    });
    rtePlaceholder(ed);
  }

  /* =====================================================================
     Serienlogik — 1:1 aus dem Desktop-Board, damit Wiederholungen
     beim Erledigen am Handy korrekt weitergestellt werden
     ===================================================================== */
  function recMatches(s,d){
    var st = parseISO(normDate(s.startDate)); if (!st) return false;
    if (d < st) return false;
    var ed = s.endDate ? parseISO(normDate(s.endDate)) : null; if (ed && d > ed) return false;
    var iv = Math.max(1, parseInt(s.interval) || 1), freq = s.freq || "weekly";
    if (freq === "daily") return daysBetween(st,d) % iv === 0;
    if (freq === "weekly"){
      var wd = (d.getDay()+6)%7;
      var wds = String(s.weekdays||"").split(",").map(function(x){ return parseInt(x.trim()); }).filter(function(x){ return !isNaN(x); });
      if (wds.length){ if (wds.indexOf(wd) < 0) return false; }
      else if (wd !== ((st.getDay()+6)%7)) return false;
      return Math.floor(daysBetween(mondayOf(st), mondayOf(d))/7) % iv === 0;
    }
    if (freq === "monthly"){
      var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      var domRaw = String(s.dayOfMonth||"").toLowerCase();
      var target = (domRaw === "last") ? lastDay : Math.min(parseInt(s.dayOfMonth) || st.getDate(), lastDay);
      if (d.getDate() !== target) return false;
      var mb = (d.getFullYear()-st.getFullYear())*12 + (d.getMonth()-st.getMonth());
      return mb >= 0 && mb % iv === 0;
    }
    if (freq === "yearly"){
      if (d.getMonth() !== st.getMonth()) return false;
      var ld = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      if (d.getDate() !== Math.min(st.getDate(), ld)) return false;
      var yb = d.getFullYear() - st.getFullYear();
      return yb >= 0 && yb % iv === 0;
    }
    return false;
  }
  function recFirstFrom(s, minISO){
    var st = parseISO(normDate(s.startDate)); if (!st) return "";
    var m = minISO ? parseISO(minISO) : null;
    var c = (m && m > st) ? m : st;
    var ed = s.endDate ? parseISO(normDate(s.endDate)) : null;
    for (var i=0;i<4000;i++){
      if (recMatches(s,c)) return toISO(c);
      c = new Date(c.getFullYear(), c.getMonth(), c.getDate()+1);
      if (ed && c > ed) return "";
    }
    return "";
  }
  function recNext(s, afterISO){
    var d = parseISO(afterISO) || parseISO(normDate(s.startDate)); if (!d) return "";
    var ed = s.endDate ? parseISO(normDate(s.endDate)) : null;
    for (var i=0;i<4000;i++){
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
      if (recMatches(s,d)) return toISO(d);
      if (ed && d > ed) return "";
    }
    return "";
  }
  function recToRow(s){
    return { series_id:s.series_id, title:s.title||"", description:s.description||"", tags:s.tags||"",
             priority:s.priority||"", status:s.status||"Backlog", freq:s.freq||"weekly",
             interval:s.interval||1, weekdays:s.weekdays||"", dayOfMonth:s.dayOfMonth||"",
             startDate:normDate(s.startDate), endDate:normDate(s.endDate),
             nextDate:normDate(s.nextDate), active:(s.active===false)?"FALSE":"TRUE" };
  }
  function withinLead(iso){ return iso ? daysBetween(parseISO(todayISO()), parseISO(iso)) <= LEAD_DAYS : false; }
  function findSeriesTicket(s){
    return tickets.find(function(t){
      return (t.series_id && t.series_id === s.series_id) || (t.title === s.title && t.dueDate === s.nextDate);
    });
  }
  async function materializeOccurrence(s, iso){
    var t = { id:uid(), title:s.title, description:s.description||"", dueDate:iso,
              status:s.status||"Backlog", priority:s.priority||"",
              tags:(s.tags||"").split(",").map(function(x){ return x.trim(); }).filter(Boolean),
              comments:[], series_id:s.series_id };
    tickets.push(t);
    await appendRow(TAB_TICKETS, ticketToRow(t));
    return t;
  }
  // Faellige Wiederholungen zu echten Karten machen. Das Aufraeumen von Doubletten
  // bleibt bewusst dem Desktop ueberlassen — vom Handy aus sollen keine Tickets
  // automatisch geloescht werden.
  async function ensureRecurring(){
    for (var i=0;i<recurring.length;i++){
      var s = recurring[i];
      if (!s.active) continue;
      if (!s.nextDate){
        var f = recFirstFrom(s, todayISO());
        if (f){ s.nextDate = f; try { await updateRow(TAB_RECURRING,"series_id",s.series_id,recToRow(s)); } catch(e){} }
      }
      if (!s.nextDate) continue;
      if (!findSeriesTicket(s) && withinLead(s.nextDate)){
        try { await materializeOccurrence(s, s.nextDate); } catch(e){}
      }
    }
  }

  /* =====================================================================
     Zustand
     ===================================================================== */
  var tickets = [], recurring = [], doneTabOk = false, lastLoadOk = 0;
  var view = "today";
  var query = "", filterTags = [], loaded = false;
  var editing = null;       // Ticket in der Detailansicht (null = neu)
  var draft = null;         // Arbeitskopie der Detailansicht
  var infos = [], infosOk = false, infosMissing = false, infosError = "";
  // subtasksOk  = die Unteraufgaben sind bestaetigt geladen
  // subtasksFehlt = das Sheet hat den Tab wirklich nicht (vom Server gemeldet)
  // Beides getrennt zu fuehren ist noetig: vor der ersten Antwort ist nur
  // "noch nicht geprueft" wahr — und das ist keine Fehlermeldung wert.
  var subtasksOk = false, subtasksFehlt = false;
  var infoEditing = null;   // Info in der Detailansicht (null = neu)
  var infoDraft = null;
  var infoMode = null;      // null = Ticket-Detail, "read" oder "edit" = Info-Detail
  var undoAction = null, snackTimer = null;

  var $ = function(id){ return document.getElementById(id); };

  /* =====================================================================
     Zwischenspeicher — damit beim Start sofort der letzte Stand dasteht,
     auch wenn Google gerade lahmt oder das Netz fehlt
     ===================================================================== */
  var CACHE_KEY = "board-cache-v1";
  var cacheTs = 0;
  function cacheSave(){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        ts:Date.now(), tickets:tickets, recurring:recurring, infos:infos, infosOk:infosOk,
        subtasksOk:subtasksOk, subtasksFehlt:subtasksFehlt
      }));
      cacheTs = Date.now();
    } catch(e){}
  }
  // Nach Änderungen mitschreiben, aber gebündelt statt bei jedem Zeichnen
  var cacheTimer = null;
  function cacheSaveLater(){
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function(){ if (loaded) cacheSave(); }, 1500);
  }
  function cacheLoad(){
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (!c || !Array.isArray(c.tickets)) return false;
      tickets = c.tickets; recurring = c.recurring || []; infos = c.infos || [];
      infosOk = !!c.infosOk; cacheTs = c.ts || 0;
      // Der Tab war beim letzten Mal da — bis zur naechsten Antwort gilt das
      // weiter. Sonst behauptet die App minutenlang, es gaebe ihn nicht.
      subtasksOk = !!c.subtasksOk; subtasksFehlt = !!c.subtasksFehlt;
      return true;
    } catch(e){ return false; }
  }

  /* =====================================================================
     Laden — nacheinander statt parallel: Apps Script arbeitet Aufrufe
     eines Nutzers ohnehin der Reihe nach ab, gleichzeitige Anfragen
     bremsen sich nur gegenseitig. Nach jedem Schritt wird gezeichnet,
     die Tickets stehen also schon nach der ersten Antwort.
     ===================================================================== */
  function mapTickets(rawT, byTicket, bySub){
    bySub = bySub || {};
    return (rawT||[]).map(function(r){
      return { id:r.id, title:r.title||"", dueDate:normDate(r.dueDate), subtasks:bySub[r.id]||[],
               status:STATUSES.indexOf(r.status)>=0 ? r.status : STATUSES[0],
               priority:r.priority||"", description:r.description||"",
               tags:(r.tags||"").split(",").map(function(s){ return s.trim(); }).filter(Boolean),
               comments:byTicket[r.id]||[], series_id:r.series_id||"" };
    });
  }
  function subtasksById(rawS){
    var by = {};
    (rawS||[]).forEach(function(x){
      if (!x.subtask_id || !x.ticket_id) return;
      (by[x.ticket_id] = by[x.ticket_id] || []).push({
        subtask_id:x.subtask_id, title:x.title||"",
        done:String(x.done).toUpperCase()==="TRUE", pos:Number(x.pos)||0,
        doneAt:x.doneAt ? normTs(x.doneAt) : 0 });
    });
    Object.keys(by).forEach(function(k){ by[k].sort(function(a,b){ return a.pos - b.pos; }); });
    return by;
  }
  function subListe(t){ return (t && t.subtasks) || []; }
  function subStats(t){ var l = subListe(t); return { done:l.filter(function(s){ return s.done; }).length, total:l.length }; }
  function subNaechstePos(l){ return l.length ? Math.max.apply(null, l.map(function(s){ return s.pos; })) + SUB_SCHRITT : SUB_SCHRITT; }
  function subToRow(s, ticketId){
    return { subtask_id:s.subtask_id, ticket_id:ticketId, title:s.title||"",
             done: s.done ? "TRUE" : "FALSE", pos: s.pos, doneAt: s.doneAt||"" };
  }

  function commentsById(rawC){
    var by = {};
    (rawC||[]).forEach(function(c){
      (by[c.ticket_id] = by[c.ticket_id] || []).push(
        { comment_id:c.comment_id, text:c.text, ts:normTs(c.timestamp) });
    });
    Object.keys(by).forEach(function(k){ by[k].sort(function(a,b){ return b.ts - a.ts; }); });
    return by;
  }
  async function loadAll(){
    var d = await readTabs([TAB_TICKETS, TAB_COMMENTS, TAB_RECURRING, TAB_INFOS, TAB_SUBTASKS]);

    // Tickets sind Pflicht — ohne sie ist der Ladevorgang gescheitert
    var rawT = d[TAB_TICKETS];
    if (!Array.isArray(rawT)) throw new Error((rawT && rawT.error) || "Tickets konnten nicht geladen werden");

    // Kommentare: bei einem Ausfall den bisherigen Stand behalten statt zu leeren
    var byTicket;
    if (Array.isArray(d[TAB_COMMENTS])) byTicket = commentsById(d[TAB_COMMENTS]);
    else { byTicket = {}; tickets.forEach(function(t){ if ((t.comments||[]).length) byTicket[t.id] = t.comments; }); }
    // Unteraufgaben ebenso — lieber den alten Stand behalten als sie verschwinden lassen
    var bySub;
    subtasksOk = Array.isArray(d[TAB_SUBTASKS]);
    if (subtasksOk){
      subtasksFehlt = false;
      bySub = subtasksById(d[TAB_SUBTASKS]);
    } else {
      // Nur wenn der Server ausdruecklich sagt, dass es den Tab nicht gibt.
      // Ein Zeitablauf oder eine halbe Antwort heisst nicht, dass er fehlt.
      var subFehler = (d[TAB_SUBTASKS] && d[TAB_SUBTASKS].error) || "";
      subtasksFehlt = /nicht gefunden|not found/i.test(subFehler);
      bySub = {}; tickets.forEach(function(t){ if ((t.subtasks||[]).length) bySub[t.id] = t.subtasks; });
    }
    tickets = mapTickets(rawT, byTicket, bySub);
    loaded = true;

    if (Array.isArray(d[TAB_RECURRING])){
      recurring = d[TAB_RECURRING].filter(function(x){ return x.series_id; }).map(function(x){
        return { series_id:x.series_id, title:x.title||"", description:x.description||"", tags:x.tags||"",
                 priority:x.priority||"", status:STATUSES.indexOf(x.status)>=0 ? x.status : "Backlog",
                 freq:x.freq||"weekly", interval:parseInt(x.interval)||1, weekdays:x.weekdays||"",
                 dayOfMonth:x.dayOfMonth||"", startDate:normDate(x.startDate), endDate:normDate(x.endDate),
                 nextDate:normDate(x.nextDate), active:String(x.active).toUpperCase()!=="FALSE" };
      });
    }

    var rawI = d[TAB_INFOS];
    if (Array.isArray(rawI)){
      infosOk = true; infosMissing = false; infosError = "";
      infos = rawI.filter(function(r){ return r && r.id; }).map(function(r){
        return { id:r.id, title:r.title||"", rows:r.rows||"", body:r.body||"",
                 tags:String(r.tags||"").split(",").map(function(s){ return s.trim(); }).filter(Boolean),
                 pinned:String(r.pinned||"").toUpperCase()==="TRUE", updatedAt:normTs(r.updatedAt) };
      });
    } else {
      infosOk = false;
      infosError = (rawI && rawI.error) || "Infos konnten nicht geladen werden";
      infosMissing = /nicht gefunden|not found/i.test(infosError);
    }

    render();
    try { await ensureRecurring(); render(); } catch(e){}

    lastLoadOk = Date.now();
    cacheSave();
  }

  /* Der Done-Tab wird nur gebraucht, wenn wirklich archiviert wird —
     ihn beim Start mitzuladen kostet eine ganze Anfrage umsonst. */
  async function ensureDoneTab(){
    if (doneTabOk) return true;
    try { doneTabOk = Array.isArray(await readTab(TAB_DONE)); } catch(e){ doneTabOk = false; }
    return doneTabOk;
  }

  var reloading = false;
  async function reload(silent){
    if (reloading) return;
    // Solange Aenderungen ausstehen, nicht neu laden — sonst ueberschreibt
    // der Serverstand das, was noch unterwegs ist.
    if (queue.length){ if (!silent) snack("Änderungen werden noch gespeichert…"); queueRun(); return; }
    reloading = true;
    $("bReload").style.opacity = ".4";
    if (!silent && !loaded) $("main").innerHTML = '<div class="loading"><div class="spin"></div>Lädt…</div>';
    try { await loadAll(); render(); }
    catch(e){
      if (!loaded) $("main").innerHTML = '<div class="empty">Laden fehlgeschlagen.<br>'+esc(e.message||String(e))+'</div>';
      else snack("Nicht aktualisiert — angezeigt wird der letzte Stand", null, true);
    }
    finally { reloading = false; $("bReload").style.opacity = ""; }
  }

  function logActivity(type, t, text){
    appendRow(TAB_ACTIVITY, { activity_id:uid(), ticket_id:t.id, type:type,
                              title:t.title||"", text:text||"", timestamp:Date.now() }).catch(function(){});
  }

  /* =====================================================================
     Filter
     ===================================================================== */
  function passes(t){
    if (t.status === "Done") return false;
    if (filterTags.length && !filterTags.some(function(tg){ return (t.tags||[]).indexOf(tg) >= 0; })) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return [t.title, t.description, statusLabel(t.status), (t.tags||[]).join(" "),
            (t.comments||[]).map(function(c){ return c.text; }).join(" ")]
           .join(" ").toLowerCase().indexOf(q) >= 0;
  }

  /* =====================================================================
     Darstellung
     ===================================================================== */
  /* Eine Zeile, zwei Textebenen: Titel oben, alles Weitere grau darunter
     in einem Fluss. Status und Datum sind darin weiterhin antippbar. */
  /* Zeile Zeile-fuer-Zeile wie am Desktop: Frist links, Haken, Titel,
     darunter Tag und ggf. "Blockiert". Symbol statt Emoji. */
  /* Farbe eines Tickets = Farbe seines ersten Kuerzels. Ohne Kuerzel der
     Akzent, damit nie ein farbloser Balken dasteht. */
  function ticketFarbe(t){
    var erst = (t.tags||[]).filter(function(x){ return TAG_COLOR[x]; })[0];
    return erst ? TAG_COLOR[erst] : "var(--accent)";
  }
  /* Das Datum als Angabe, nicht als Satz: heute wird zum Wort, alles andere
     bleibt die Zahl. Ueberfaellig behaelt sein Datum — "ueberfaellig" allein
     verschweigt, seit wann. */
  function kartenDatum(iso){
    if (!iso) return { txt:"—", cls:"leer" };
    var c = dueClass(iso);
    if (c === "today") return { txt:"HEUTE", cls:"today" };
    return { txt: fmtKurz(iso), cls: c === "over" ? "overdue" : "" };
  }
  function cardHtml(t, mitDatum){
    var tag = (t.tags||[]).filter(function(tg){ return TAGS.indexOf(tg)>=0; })[0] || (t.tags||[])[0] || "";
    var farbe = ticketFarbe(t);
    var marke = '<span class="k-marke" style="color:'+farbe+'">'
              + (ticketIcon(t, 16) || icon("marke", 16)) + '</span>';
    var d = kartenDatum(t.dueDate);
    var felder = '<div class="k-felder">'
      + '<div><span class="k-lab">Fällig</span><span class="k-wert '+d.cls+'">'+esc(d.txt)+'</span></div>'
      + '<div><span class="k-lab">Kategorie</span><span class="k-wert'+(tag?"":" leer")+'">'+(tag?esc(tag):"—")+'</span></div>'
      + '</div>';
    var st = subStats(t);
    // Kurzform, weil links im Fuss schon der Status steht
    var stand = st.total ? (st.done+"/"+st.total+" erledigt") : "—";
    var breite = st.total ? Math.round(st.done/st.total*100) : 6;
    var fuss = '<div class="k-fuss">'
      + '<span class="k-status'+(t.status==="Blocked"?" blockiert":"")+'">'+esc(statusLabel(t.status))+'</span>'
      + '<div class="k-fort"><div class="k-stand"'+(st.total?"":' title="ohne Unteraufgaben"')+'>'+esc(stand)+'</div>'
      + '<div class="k-balken"><i style="width:'+breite+'%'+(st.total?"":";opacity:.35")+'"></i></div></div>'
      + '<span class="k-doppel"><u></u><i></i></span></div>';
    return '<div class="swipe" data-id="'+t.id+'">'
      + '<div class="swipe-bg erledigt"></div><div class="swipe-bg spaeter"></div>'
      + '<div class="card" data-id="'+t.id+'" style="--k-farbe:'+farbe+'">'
      +   '<div class="k-kopf" data-act="open">'
      +     '<button class="k-hk" data-act="done" aria-label="Erledigt"></button>'
      +     '<div class="k-titel">'+esc(t.title||"(ohne Titel)")+'</div>'+marke
      +   '</div>'
      +   '<div data-act="open">'+felder+fuss+'</div>'
      + '</div></div>';
  }

  function sortByDue(a,b){
    if (!a.dueDate && !b.dueDate) return (a.title||"").localeCompare(b.title||"");
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
  }

  /* Gruppierung Zeile fuer Zeile aus der Desktop-Fassung uebernommen:
     Ueberfaellig, Heute, Morgen — und danach EINE Gruppe je einzelnem Datum,
     benannt nach dem Wochentag. Kein "Diese Woche"/"Spaeter" mehr. */
  /* Zugeklappte Gruppen werden gemerkt. */
  var grpZu = {};
  try { grpZu = JSON.parse(localStorage.getItem("board-gruppen-zu-mobil") || "{}") || {}; } catch(e){ grpZu = {}; }
  var WT_LANG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var WT_KURZ = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  function tagLang(iso){ var d=parseISO(iso); return d ? WT_LANG[d.getDay()] : ""; }
  function tagKurz(iso){ var d=parseISO(iso); return d ? WT_KURZ[d.getDay()] : ""; }
  function fmtKurz(iso){ var d=parseISO(iso); if(!d) return "";
    return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; }

  function listenGruppen(){
    var heute = todayISO(), d = parseISO(heute);
    var morgen = toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate()+1));
    var offen = tickets.filter(function(t){ return t.status!=="Done" && passes(t); });
    var nachTitel = function(a,b){ return (a.title||"").localeCompare(b.title||""); };
    var g = [];

    var ueber = offen.filter(function(t){ return t.dueDate && t.dueDate < heute; })
                     .sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate) || nachTitel(a,b); });
    if (ueber.length) g.push({ id:"ueber", klasse:"spaet", titel:"Überfällig",
                               sub:"seit "+fmtKurz(ueber[0].dueDate), items:ueber, mitDatum:true });

    var hItems = offen.filter(function(t){ return t.dueDate === heute; }).sort(nachTitel);
    if (hItems.length) g.push({ id:"heute", klasse:"heute", titel:"Heute",
                                sub:tagLang(heute)+", "+fmtKurz(heute), items:hItems, mitDatum:false });

    var mItems = offen.filter(function(t){ return t.dueDate === morgen; }).sort(nachTitel);
    if (mItems.length) g.push({ id:"morgen", klasse:"", titel:"Morgen",
                                sub:tagLang(morgen)+", "+fmtKurz(morgen), items:mItems, mitDatum:false });

    var spaeter = offen.filter(function(t){ return t.dueDate && t.dueDate > morgen; });
    var tage = spaeter.map(function(t){ return t.dueDate; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).sort();
    tage.forEach(function(iso){
      g.push({ id:"d"+iso, klasse:"", titel:tagLang(iso), sub:fmtKurz(iso),
               items:spaeter.filter(function(t){ return t.dueDate===iso; }).sort(nachTitel), mitDatum:false });
    });

    var ohne = offen.filter(function(t){ return !t.dueDate; }).sort(nachTitel);
    if (ohne.length) g.push({ id:"ohne", klasse:"", titel:"Ohne Datum", sub:"", items:ohne, mitDatum:false });
    return g;
  }

  function renderToday(){
    var g = listenGruppen();
    $("main").innerHTML = g.length
      ? g.map(function(b){
          var zu = !!grpZu[b.id];
          return '<section class="grp '+b.klasse+'">'
               + '<h2 class="'+(zu?"zu":"")+'" data-grp="'+esc(b.id)+'">'+esc(b.titel)
               + '<small>'+esc((b.sub? b.sub+" · ":"")+b.items.length)+'</small></h2>'
               + (zu ? "" : b.items.map(function(t){ return cardHtml(t, b.mitDatum); }).join(""))
               + '</section>';
        }).join("")
      : '<div class="leer">Nichts offen.</div>';
  }


  /* Verteilung ueber die gerade sichtbaren Tickets — folgt also Filter und Suche */
  function dashStats(){
    var open = tickets.filter(passes), today = parseISO(todayISO());
    var counts = OPEN_STATUSES.map(function(s){
      return open.filter(function(t){ return t.status === s; }).length;
    });
    return {
      counts: counts,
      total: counts.reduce(function(a,b){ return a+b; }, 0),
      overdue: open.filter(function(t){ return t.dueDate && parseISO(t.dueDate) < today; }).length
    };
  }
  function renderDash(){
    var st = dashStats();
    var segs = st.total
      ? OPEN_STATUSES.map(function(s,i){
          return st.counts[i] ? '<span style="flex:'+st.counts[i]+';background:'+STATUS_COLORS[s]+'"></span>' : "";
        }).join("")
      : '<span style="flex:1;background:var(--line)"></span>';
    $("dashBar").innerHTML = (st.overdue ? '<span class="warn"></span>' : '')
      + '<span class="segs">' + segs + '</span>';
  }

  /* =====================================================================
     Infos — Nachschlagen (Tabelle "Bezeichnung: Wert" plus Markdown-Text)
     ===================================================================== */
  function infoRowsParse(text){
    return String(text||"").split(/\r?\n/).map(function(l){ return l.trim(); })
      .filter(Boolean).map(function(l){
        var i = l.indexOf(":");                    // am ersten Doppelpunkt trennen
        return i < 0 ? { k:"", v:l } : { k:l.slice(0,i).trim(), v:l.slice(i+1).trim() };
      });
  }
  function infoRowsSerialize(pairs){
    return pairs.filter(function(p){ return (p.k||"").trim() || (p.v||"").trim(); })
      .map(function(p){ return (p.k||"").trim() + ": " + (p.v||"").trim(); }).join("\n");
  }
  function infoToRow(n){
    return { id:n.id, title:n.title||"", rows:n.rows||"", body:n.body||"",
             tags:(n.tags||[]).join(","), pinned:n.pinned ? "TRUE" : "FALSE",
             updatedAt:n.updatedAt||Date.now() };
  }
  function infoPasses(n){
    if (filterTags.length && !filterTags.some(function(tg){ return (n.tags||[]).indexOf(tg) >= 0; })) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return [n.title, n.rows, n.body, (n.tags||[]).join(" ")].join(" ").toLowerCase().indexOf(q) >= 0;
  }
  function infoById(id){ return infos.find(function(n){ return n.id === id; }); }

  function copyValue(txt){
    function ok(){ snack("Kopiert"); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly","");
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, txt.length);   // iOS braucht den Bereich
      var done = false;
      try { done = document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta);
      if (done) ok(); else snack("Kopieren nicht möglich", null, true);
    }
    if (navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(txt).then(ok).catch(fallback);
    else fallback();
  }

  function renderInfos(){
    if (!infosOk && !infosMissing){
      $("main").innerHTML = '<div class="isetup"><b>Infos konnten nicht geladen werden.</b><br><br>'
        + esc(infosError || "Die letzte Aktualisierung ist fehlgeschlagen.")
        + '<br><br>Der Tab ist im Sheet vorhanden — vermutlich eine kurze Störung. '
        + 'Oben rechts auf „Aktualisieren“ tippen.</div>';
      return;
    }
    if (!infosOk){
      $("main").innerHTML = '<div class="isetup">Der Tab <b>Infos</b> fehlt im Google Sheet.<br><br>'
        + 'Lege dort einmalig ein Tabellenblatt <code>Infos</code> an, mit diesen Spalten in Zeile 1:<br><br>'
        + '<code>id</code> <code>title</code> <code>rows</code> <code>body</code> '
        + '<code>tags</code> <code>pinned</code> <code>updatedAt</code><br><br>'
        + 'Danach oben auf „Aktualisieren“ tippen.</div>';
      return;
    }
    var list = infos.filter(infoPasses).sort(function(a,b){
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (a.title||"").localeCompare(b.title||"", "de", { sensitivity:"base" });
    });
    if (!list.length){
      $("main").innerHTML = "";
      return;
    }
    $("main").innerHTML = list.map(function(n){
      var pairs = infoRowsParse(n.rows);
      var sub = pairs.length
        ? pairs.map(function(p){ return p.k || p.v; }).join(" · ")
        : (n.body ? n.body.replace(/[#*`\-]/g," ").replace(/\s+/g," ").trim() : "");
      // Symbol statt Farbpunkt — dieselbe Zuordnung wie in der Aufgabenliste.
      // Farbe traegt in dieser Sprache nur "heute" und "blockiert".
      var dots = (n.tags||[]).map(function(t){ return iconFuerTag(t, 14); }).join("");
      return '<button class="icard" data-info="'+esc(n.id)+'">'
        + '<span class="imain"><span class="ittl">'+(n.pinned?'<span class="istar">★</span> ':'')
        + esc(n.title||"(ohne Titel)")+'</span>'
        + (sub ? '<span class="isub">'+esc(sub)+'</span>' : '') + '</span>'
        + (dots ? '<span class="idots">'+dots+'</span>' : '')
        + '</button>';
    }).join("");
  }

  function infoRowAdd(k, v, focus){
    var box = $("iRows");
    var row = document.createElement("div");
    row.className = "irow";
    row.innerHTML = '<input class="ik-in" placeholder="Bezeichnung" value="'+esc(k||"")+'">'
                  + '<input class="iv-in" placeholder="Wert" value="'+esc(v||"")+'">'
                  + '<button class="idel" aria-label="Zeile entfernen">✕</button>';
    box.appendChild(row);
    row.querySelector(".idel").addEventListener("click", function(){
      row.remove(); if (!box.children.length) infoRowAdd("","");
    });
    [row.querySelector(".ik-in"), row.querySelector(".iv-in")].forEach(function(inp){
      inp.addEventListener("paste", function(e){
        var txt = (e.clipboardData || window.clipboardData).getData("text");
        if (!/[\t\n]/.test(txt)) return;
        e.preventDefault();
        var pairs = txt.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean)
          .map(function(l){
            if (l.indexOf("\t") >= 0){ var p = l.split("\t");
              return { k:p[0].trim(), v:p.slice(1).join(" ").trim() }; }
            var i = l.indexOf(":");
            return i < 0 ? { k:"", v:l } : { k:l.slice(0,i).trim(), v:l.slice(i+1).trim() };
          });
        if (!row.querySelector(".ik-in").value && !row.querySelector(".iv-in").value) row.remove();
        pairs.forEach(function(p){ infoRowAdd(p.k, p.v); });
        if (!box.children.length) infoRowAdd("","");
      });
    });
    if (focus) row.querySelector(".ik-in").focus();
  }

  async function saveInfo(){
    syncInfoEditors();
    if (!infoDraft.title.trim()){ snack("Bitte einen Titel eingeben", null, true); return; }
    var btn = $("dSave"); btn.disabled = true; btn.textContent = "Sichert…";
    try {
      if (infoEditing){
        var back = { title:infoEditing.title, rows:infoEditing.rows, body:infoEditing.body,
                     tags:(infoEditing.tags||[]).slice(), pinned:infoEditing.pinned };
        Object.assign(infoEditing, { title:infoDraft.title.trim(), rows:infoDraft.rows,
                                     body:infoDraft.body, tags:infoDraft.tags.slice(),
                                     pinned:infoDraft.pinned, updatedAt:Date.now() });
        try { await updateRow(TAB_INFOS, "id", infoEditing.id, infoToRow(infoEditing)); }
        catch(e){ Object.assign(infoEditing, back); throw e; }
        infoMode = "read"; renderInfoDetail();
      } else {
        var n = { id:uid(), title:infoDraft.title.trim(), rows:infoDraft.rows, body:infoDraft.body,
                  tags:infoDraft.tags.slice(), pinned:infoDraft.pinned, updatedAt:Date.now() };
        await appendRow(TAB_INFOS, infoToRow(n));
        infos.push(n);
        infoEditing = n; infoMode = "read"; renderInfoDetail();
      }
      render();
      snack("Gesichert");
    } catch(e){ snack("Sichern fehlgeschlagen", null, true); }
    finally { btn.disabled = false; renderInfoDetail(); }
  }

  function snack(text, undoFn, isErr){
    clearTimeout(snackTimer);
    undoAction = undoFn || null;
    $("snackText").textContent = text;
    $("snackBtn").textContent = undoFn ? "Rückgängig" : "OK";
    $("snack").classList.toggle("err", !!isErr);
    $("snack").classList.add("on");
    snackTimer = setTimeout(hideSnack, undoFn ? 7000 : 3500);
  }
  function hideSnack(){ $("snack").classList.remove("on"); undoAction = null; }

  function byId(id){ return tickets.find(function(t){ return t.id === id; }); }

  function fadeCard(id, after){
    var el = document.querySelector('.card[data-id="'+id+'"]');
    if (!el){ after(); return; }
    el.classList.add("going");
    setTimeout(after, 200);
  }

  var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confettiBurst(x, y){
    if (reducedMotion) return;
    var accent = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#C46730";
    var farben = [accent, "#E0A458", "#6E9887", "#C0442E", "#f5c542"];
    for (var i = 0; i < 22; i++){
      var p = document.createElement("div"); p.className = "confetti";
      var ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 80;
      p.style.left = x + "px"; p.style.top = y + "px"; p.style.background = farben[i % farben.length];
      p.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(0) + "px");
      p.style.setProperty("--dy", (Math.sin(ang) * dist - (40 + Math.random() * 40)).toFixed(0) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
      p.style.animationDelay = (Math.random() * 0.05).toFixed(2) + "s";
      document.body.appendChild(p);
      setTimeout(function(el){ return function(){ el.remove(); }; }(p), 1000);
    }
  }
  async function completeTicket(id){
    var t = byId(id); if (!t) return;
    var idx = tickets.indexOf(t), prev = t.status;
    var series = t.series_id ? recurring.find(function(s){ return s.series_id === t.series_id; }) : null;
    var prevNext = series ? series.nextDate : null;

    tickets.splice(idx, 1);
    fadeCard(id, render);

    try {
      if (series){
        // Serie: Ticket verschwindet, Serie rueckt auf den naechsten Termin vor
        logActivity("status", t, prev + " → Done");
        await deleteRows(TAB_TICKETS, "id", t.id);
        var nx = recNext(series, series.nextDate || t.dueDate);
        series.nextDate = nx;
        await updateRow(TAB_RECURRING, "series_id", series.series_id, recToRow(series));
        var created = null;
        if (nx && withinLead(nx)) created = await materializeOccurrence(series, nx);
        render();
        snack("Erledigt · Serie weitergestellt", function(){ undoSeries(t, series, prevNext, created); });
      } else {
        if (!(await ensureDoneTab())) throw new Error("Der 'Done'-Tab konnte nicht gelesen werden.");
        logActivity("status", t, prev + " → Done");
        var row = Object.assign({}, ticketToRow(t), { status:"Done", doneAt:Date.now() });
        var g = "erl" + t.id;
        await appendRow(TAB_DONE, row, g);
        await deleteRows(TAB_TICKETS, "id", t.id, g);
        snack("Erledigt", function(){ undoArchive(t); });
      }
    } catch(e){
      tickets.splice(idx, 0, t);
      render();
      snack("Fehlgeschlagen: " + (e.message || e), null, true);
    }
  }

  async function undoArchive(t){
    try {
      var g = "wdh" + t.id;
      await appendRow(TAB_TICKETS, ticketToRow(t), g);
      await deleteRows(TAB_DONE, "id", t.id, g);
      tickets.push(t); render();
      snack("Wiederhergestellt");
    } catch(e){ snack("Rückgängig fehlgeschlagen", null, true); }
  }
  async function undoSeries(t, series, prevNext, created){
    try {
      if (created){
        tickets = tickets.filter(function(x){ return x.id !== created.id; });
        await deleteRows(TAB_TICKETS, "id", created.id);
      }
      await appendRow(TAB_TICKETS, ticketToRow(t));
      tickets.push(t);
      series.nextDate = prevNext;
      await updateRow(TAB_RECURRING, "series_id", series.series_id, recToRow(series));
      render();
      snack("Wiederhergestellt");
    } catch(e){ snack("Rückgängig fehlgeschlagen", null, true); }
  }

  async function patchTicket(t, changes, logText){
    var before = { status:t.status, dueDate:t.dueDate };
    Object.assign(t, changes);
    render();
    try {
      await updateRow(TAB_TICKETS, "id", t.id, ticketToRow(t));
      if (logText) logActivity("status", t, logText);
    } catch(e){
      Object.assign(t, before); render();
      snack("Speichern fehlgeschlagen", null, true);
    }
  }
