<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mein Board</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mein Board">
<meta name="theme-color" id="themeColor" content="#FDF2E3">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Grundfarben hell. --cream/--ink/--accent setzt applyTheme() zur Laufzeit
     aus dem gewaehlten Preset; hier stehen nur die Startwerte. */
  :root {
    --cream:#FDF2E3; --ink:#253B44; --accent:#C46730; --accent-dark:#A9541F;
    --muted:#7C8A90; --line:rgba(37,59,68,.13); --card:#fff;
    --chip:rgba(37,59,68,.07); --overdue:#C0442E; --on-accent:#fff;
    --sheet:#fff; --shadow:0 2px 10px rgba(37,59,68,.07);
    --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
    /* Aus der Desktop-Sprache uebernommen: eine hellere Zweitfarbe fuer die
       Versalien-Zeilen, eine zartere Linie und die gemeinsame Beschleunigung. */
    --muted-hell:#8B959A; --line-zart:rgba(37,59,68,.07);
    --rahmen:rgba(37,59,68,.22); --feld-radius:9px;
    --weich:cubic-bezier(.2,.8,.25,1);
    color-scheme: light;
  }
  /* Dunkle Flaechenfarben. Vor dem Start des Skripts entscheidet die
     Systemeinstellung, danach setzt applyTheme() die Klasse t-dark bzw. t-light. */
  @media (prefers-color-scheme: dark) {
    html:not(.t-light):not(.t-dark) {
      --cream:#191F22; --ink:#E9E4D8; --accent:#D07A40; --accent-dark:#B86630;
      --muted:#93A0A8; --line:rgba(255,255,255,.12); --card:#222A2E;
      --line-zart:rgba(255,255,255,.07); --rahmen:rgba(255,255,255,.20);
      --chip:rgba(255,255,255,.08); --overdue:#E5675C;
      --sheet:#232B2F; --shadow:0 2px 10px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  html.t-dark {
    --muted:#93A0A8; --line:rgba(255,255,255,.12); --card:#222A2E;
    --line-zart:rgba(255,255,255,.07); --rahmen:rgba(255,255,255,.20);
    --chip:rgba(255,255,255,.08); --overdue:#E5675C;
    --sheet:#232B2F; --shadow:0 2px 10px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior-y:none; }
  body {
    margin:0; background:var(--cream); color:var(--ink);
    /* Schriftwahl liegt auf --font. Alles andere steht auf font:inherit,
       deshalb reicht diese eine Stelle. Nur Schriften, die schon da sind —
       nichts nachladen, die App soll offline laufen. */
    font:16px/1.45 var(--font, -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:none; border:none; padding:0; cursor:pointer; }
  .hidden { display:none !important; }

  /* ---------- Kopfzeile ---------- */
  header {
    position:sticky; top:0; z-index:30; background:var(--cream);
    padding-top:var(--top); border-bottom:1px solid var(--line);
  }
  .hdr-row { display:flex; align-items:center; gap:2px; padding:8px 10px 10px 14px; }
  .hdr-row h1 { font-size:25px; font-weight:400; letter-spacing:-.02em; margin:0; flex:1; }
  .ico { width:38px; height:38px; display:flex; align-items:center; justify-content:center;
         border-radius:11px; color:var(--muted); flex:0 0 auto; }
  .ico:active { background:var(--chip); }
  .ico.on { color:var(--on-accent); background:var(--accent); }
  /* Code: einzeilig als Auszeichnung, mehrzeilig als Block mit Querlauf */
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em;
         background:var(--chip); border-radius:5px; padding:1px 5px; }
  pre.code { background:var(--chip); border-radius:11px; padding:11px 13px; margin:8px 0;
             overflow-x:auto; -webkit-overflow-scrolling:touch; }
  pre.code code { display:block; background:none; padding:0; border-radius:0;
                  white-space:pre; font-size:13px; line-height:1.45; }
  pre.code[data-lang]:before { content:attr(data-lang); display:block; font-size:10px;
                               font-weight:800; text-transform:uppercase; letter-spacing:.06em;
                               color:var(--muted); margin-bottom:6px; }

  /* Unteraufgaben */
  .sub { display:flex; align-items:center; gap:11px; padding:11px 2px; position:relative; }
  .sub + .sub:before { content:""; position:absolute; left:33px; right:0; top:0; height:1px; background:var(--line); }
  .sub-box { width:22px; height:22px; flex:0 0 auto; border-radius:50%; border:1.5px solid var(--line);
             display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; }
  .sub.fertig .sub-box { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .sub.fertig .sub-box:after { content:"✓"; }
  .sub-titel { flex:1; min-width:0; font-size:16px; word-break:break-word; }
  .sub.fertig .sub-titel { color:var(--muted); text-decoration:line-through; }
  .sub-weg { flex:0 0 auto; color:var(--muted); padding:8px 4px; font-size:15px; }
  .sub-hinweis { font-size:14px; color:var(--muted); padding:8px 2px; }
  .sub-neu { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .sub-neu input { flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
                   background:var(--card); color:var(--ink); font-family:inherit; font-size:16px; -webkit-appearance:none; }
  .sub-neu input:focus { outline:none; border-color:var(--accent); }
  .sub-neu button { flex:0 0 auto; width:42px; height:42px; border-radius:12px; background:var(--chip);
                    color:var(--ink); font-size:22px; font-weight:600; }
  .sub-neu button:active { background:var(--accent); color:var(--on-accent); }

  /* Konfetti beim Erledigen */
  .confetti { position:fixed; width:7px; height:11px; border-radius:2px; z-index:80; pointer-events:none;
              animation:kf .9s cubic-bezier(.15,.6,.4,1) forwards; }
  @keyframes kf { to { transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }

  /* Ziehen zum Aktualisieren */
  #ptr { position:fixed; left:50%; top:calc(var(--top) + 4px); z-index:40;
         width:30px; height:30px; margin-left:-15px; border-radius:50%;
         background:var(--card); box-shadow:var(--shadow);
         display:flex; align-items:center; justify-content:center;
         opacity:0; pointer-events:none; transition:opacity .18s, transform .22s cubic-bezier(.25,.8,.3,1); }
  #ptr .ptr-kreis { width:15px; height:15px; border-radius:50%;
                    border:2px solid var(--line); border-top-color:var(--accent);
                    transition:transform .2s; }
  #ptr.bereit .ptr-kreis { transform:rotate(180deg); border-top-color:var(--accent); }
  #ptr.laeuft .ptr-kreis { animation:sp .7s linear infinite; }

  /* Zaehler fuer noch nicht weggeschriebene Aenderungen */
  #qBadge { display:none; flex:0 0 auto; min-width:19px; height:19px; padding:0 5px; border-radius:10px;
            background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:800;
            align-items:center; justify-content:center; margin-right:2px; }
  #qBadge.on { display:inline-flex; }
  .searchbar { padding:0 14px 10px; }
  .searchbar input {
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); font-size:16px; -webkit-appearance:none;
  }
  .searchbar input:focus { outline:none; border-color:var(--accent); }
  .statusbar { display:flex; gap:7px; overflow-x:auto; padding:0 14px 11px;
               scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .statusbar::-webkit-scrollbar { display:none; }
  .sbtn { flex:0 0 auto; padding:8px 14px; border-radius:11px; background:var(--chip);
          font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .sbtn.on { background:var(--accent); color:var(--on-accent); }
  .sbtn i { font-style:normal; opacity:.65; margin-left:5px; }

  /* Verteilungsbalken: optisch nur ein Haarstrich, die Polsterung sorgt
     aber fuer eine brauchbare Tippflaeche. */
  .dashbar { display:flex; align-items:center; gap:7px; width:100%; padding:2px 14px 11px; }
  .dashbar .segs { flex:1; display:flex; gap:3px; height:6px; }
  .dashbar .segs span { border-radius:3px; min-width:5px; }
  .dashbar .warn { width:8px; height:8px; border-radius:50%; background:var(--overdue); flex:0 0 auto; }
  .dash-row { display:flex; align-items:center; gap:11px; width:100%; padding:13px 12px;
              border-radius:13px; font-size:16px; font-weight:600; text-align:left; }
  .dash-row:active { background:var(--chip); }
  .dash-row .nm { flex:1; }
  .dash-row .pct { color:var(--muted); font-weight:600; font-size:13.5px; min-width:42px; text-align:right; }
  .dash-row .arr { color:var(--muted); font-weight:400; }
  .dash-sep { border-top:1px solid var(--line); margin:9px 0 3px; }

  /* ---------- Inhalt ---------- */
  main { padding:14px 14px calc(96px + var(--bot)); min-height:60vh; }
  .grp { margin-bottom:16px; }
  /* Gruppenkopf wie in der Desktop-Liste: eine echte Ueberschrift statt eines
     kleinen grauen Labels, mit Anzahl und zum Zuklappen. Volle Zeilenbreite,
     damit die Tippflaeche gross genug ist. */
  /* Gruppenkopf in der Desktop-Sprache: 19px in NORMALSTAERKE mit leicht
     negativer Laufweite, darunter eine Versalien-Zeile mit weiter Sperrung.
     Kein Fett, keine Flaeche — die Groesse allein traegt die Hierarchie. */
  .grp h2 { display:block; width:100%; text-align:left; margin:0;
            font-size:19px; font-weight:400; letter-spacing:-.015em; line-height:1.25;
            color:var(--ink); padding:26px 16px 10px; background:none; border:none; }
  .grp h2 small { display:block; font-size:10px; letter-spacing:.14em;
                  text-transform:uppercase; color:var(--muted); margin-top:7px; }
  .grp h2.zu small:after { content:" · zu"; }
  .grp.over h2, .grp.heute h2 { color:var(--accent); }

  /* Ruhige Liste: kein Gehaeuse je Zeile, Trennung nur durch Haarlinien,
     die am Text ausgerichtet sind. Farbe gibt es nur zweimal — der
     Statuspunkt links und ein rotes Datum, wenn es ueberfaellig ist. */
  /* Huelle je Zeile: darunter liegen die beiden Wisch-Flaechen, darueber
     die Zeile selbst, die beim Wischen zur Seite faehrt. */
  .swipe { position:relative; overflow:hidden; margin:0 -14px; }
  .swipe-bg { position:absolute; inset:0; display:flex; align-items:center;
              padding:0 22px; color:#fff; opacity:0; }
  .swipe-bg.erledigt { background:#6E9887; justify-content:flex-start; }
  .swipe-bg.spaeter  { background:var(--accent); justify-content:flex-end; }
  .swipe + .swipe .card:before { content:""; position:absolute; left:16px; right:16px; top:0;
                                 height:1px; background:var(--line-zart); }
  .card { display:flex; align-items:center; gap:14px; padding:12px 16px; position:relative;
          background:var(--cream); }
  .card.zieht { transition:none; }
  .card.federt { transition:transform .22s cubic-bezier(.25,.8,.3,1); }
  /* Druckgefuehl: die Zeile bekommt beim Beruehren eine ruhige Tonung */
  .card.gedrueckt { background:var(--chip); }
  .card .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-left:2px;
               align-self:flex-start; margin-top:7px; }
  .card .body { flex:1; min-width:0; }
  .card .ttl { font-size:16px; font-weight:400; line-height:1.35; letter-spacing:-.008em;
               overflow-wrap:anywhere; hyphens:auto; }
  /* Einzeilig halten — lieber abschneiden als den Rhythmus brechen */
  /* Zweitzeile als Versalien mit weiter Sperrung — dieselbe Rolle wie .li-unter
     am Desktop. Kein Umbruch: lieber abschneiden als den Rhythmus brechen. */
  .card .meta { font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
                color:var(--muted-hell); margin-top:5px; line-height:1.5;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta .sep { margin:0 7px; opacity:.5; }
  /* Status und Datum bleiben antippbar — nur ohne farbige Flaeche. Die
     Polsterung vergroessert die Tippflaeche, ohne das Layout zu aendern. */
  .card .meta .act { color:var(--muted-hell); font-size:9.5px; font-weight:400;
                     letter-spacing:.15em; text-transform:uppercase;
                     padding:9px 0; margin:-9px 0; }
  .card .meta .act.over { color:var(--overdue); }
  .card .meta .act.today { color:var(--accent); }
  .card .meta .tg { font-weight:400; }
  /* Blockiert gehoert an den Titel, nicht in die Aufzaehlung: es betrifft rund ein
     Fuenftel der Tickets und soll auffallen, ohne eine eigene Spalte zu bekommen. */
  .card .ttl-zeile { display:flex; align-items:center; gap:7px; min-width:0; }
  .card .ttl-zeile .ttl { min-width:0; }
  .card .blk { flex:0 0 auto; font-size:9.5px; font-weight:400; letter-spacing:.15em;
               text-transform:uppercase; color:var(--accent);
               background:none; border:none; padding:6px 0; margin:-6px 0; }
  .card .done-btn { flex:0 0 auto; width:34px; display:flex; align-items:center; justify-content:center; }
  .card .circ { width:13px; height:13px; border-radius:50%; border:1px solid var(--muted-hell); }
  .card .done-btn:active .circ { background:var(--accent); border-color:var(--accent); }
  .card.going { opacity:0; transform:translateX(50px); transition:opacity .2s, transform .2s; }

  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
          border-radius:8px; padding:4px 9px; background:var(--chip); color:var(--muted); }
  .pill.dt.over { background:rgba(192,68,46,.15); color:var(--overdue); }
  .pill.dt.today { background:rgba(196,103,48,.17); color:var(--accent); }
  .pill.cm { background:none; padding:4px 2px; }

  .empty { text-align:center; color:var(--muted); padding:46px 20px; font-size:15px; }
  .loading { text-align:center; color:var(--muted); padding:60px 20px; }
  .spin { width:22px; height:22px; border:2.5px solid var(--line); border-top-color:var(--accent);
          border-radius:50%; margin:0 auto 12px; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ---------- Navigation unten + FAB ---------- */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
        background:var(--cream); border-top:1px solid var(--line); padding-bottom:var(--bot); }
  nav button { flex:1; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center;
               gap:5px; font-size:9px; font-weight:400; letter-spacing:.14em;
               text-transform:uppercase; color:var(--muted); }
  nav button.on { color:var(--accent); }

  #fab { position:fixed; right:17px; bottom:calc(74px + var(--bot)); z-index:31;
         width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--on-accent);
         box-shadow:0 5px 18px rgba(37,59,68,.3); display:flex; align-items:center; justify-content:center; }
  #fab:active { background:var(--accent-dark); }

  /* ---------- Bottom-Sheet ----------
     Muss ueber der Detailansicht (z-index 50) liegen, sonst oeffnet sich
     die Status- und Datumsauswahl unsichtbar dahinter. */
  .scrim { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.35);
           opacity:0; pointer-events:none; transition:opacity .22s; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--sheet);
           border-radius:22px 22px 0 0; padding:8px 16px calc(20px + var(--bot));
           transform:translateY(101%); transition:transform .26s cubic-bezier(.25,.8,.3,1);
           max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet.on { transform:none; }
  .grab { width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
  .sheet h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
              color:var(--muted); margin:0 0 11px; }
  .opt { display:flex; align-items:center; gap:11px; width:100%; padding:14px 12px;
         border-radius:13px; font-size:16px; font-weight:600; text-align:left; }
  .opt:active, .opt.on { background:var(--chip); }
  .opt .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .opt .ck { margin-left:auto; color:var(--accent); font-weight:800; }
  .quick { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .quick button { flex:1 1 auto; padding:13px 10px; border-radius:12px; background:var(--chip);
                  font-size:15px; font-weight:600; white-space:nowrap; }
  .quick button:active { background:var(--accent); color:var(--on-accent); }
  .sheet input[type=date] {
    width:100%; padding:13px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); font-size:16px; -webkit-appearance:none; margin-bottom:6px;
  }

  /* ---------- Aussehen ---------- */
  .seg { display:flex; gap:5px; background:var(--chip); border-radius:13px; padding:4px; margin-bottom:18px; }
  .seg button { flex:1; padding:11px 6px; border-radius:10px; font-size:14.5px; font-weight:700; color:var(--muted); }
  .seg button.on { background:var(--accent); color:var(--on-accent); }
  /* Fuenf Schriften statt drei Modi: auf einem schmalen Bildschirm wuerden die
     Namen sonst umbrechen oder abgeschnitten. Kleiner setzen und knapper polstern. */
  .seg.schriftwahl button { font-size:12.5px; padding:11px 2px; font-weight:600; }
  .presets { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .pcard { border:2px solid var(--line); border-radius:15px; padding:12px; text-align:left; }
  .pcard.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .pcard .sw { display:flex; gap:5px; margin-bottom:10px; }
  .pcard .sw span { width:21px; height:21px; border-radius:6px; flex:0 0 auto; }
  .pcard .nm { font-size:13px; font-weight:700; }

  /* ---------- Detailansicht ---------- */
  .full { position:fixed; inset:0; z-index:50; background:var(--cream);
          transform:translateY(100%); transition:transform .27s cubic-bezier(.25,.8,.3,1);
          display:flex; flex-direction:column; }
  .full.on { transform:none; }
  .full-hdr { display:flex; align-items:center; gap:8px; padding:calc(var(--top) + 8px) 12px 10px;
              border-bottom:1px solid var(--line); flex:0 0 auto; }
  .full-hdr .t { flex:1; font-size:16px; font-weight:700; text-align:center; }
  .full-hdr button { padding:8px 10px; font-size:16px; font-weight:600; color:var(--accent);
                     border-radius:10px; white-space:nowrap; }
  .full-hdr button:disabled { opacity:.4; }
  .full-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
               padding:16px 16px calc(28px + var(--bot)); }
  .f-label { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:20px 0 7px; }
  .f-label:first-child { margin-top:0; }
  #dTitle {
    width:100%; border:none; background:none; font-size:22px; font-weight:700;
    letter-spacing:-.02em; padding:0; resize:none; overflow:hidden; line-height:1.25;
  }
  #dTitle:focus { outline:none; }
  .rowbtns { display:flex; gap:9px; }
  .rowbtns .pick { flex:1; padding:13px; border-radius:13px; background:var(--card);
                   box-shadow:var(--shadow); font-size:15px; font-weight:600; text-align:left;
                   display:flex; align-items:center; gap:8px; min-width:0; }
  .rowbtns .pick span.lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tagrow { display:flex; flex-wrap:wrap; gap:7px; }
  .tagopt { font-size:12px; font-weight:800; padding:8px 12px; border-radius:11px;
            border:2px solid var(--line); color:var(--muted); }
  .tagopt.on { border-color:transparent; }
  .grp-lbl { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:11px 0 6px; }

  /* ---------- Formatier-Editor ---------- */
  .rte {
    min-height:130px; padding:13px; border:1px solid var(--line); border-radius:13px;
    background:var(--card); font-size:16px; line-height:1.5; outline:none;
    word-break:break-word; -webkit-user-select:text; user-select:text;
  }
  .rte:focus { border-color:var(--accent); }
  .rte.sm { min-height:64px; }
  .rte.is-empty:before { content:attr(data-placeholder); color:var(--muted); pointer-events:none; }
  .rte ul { list-style:disc outside; margin:5px 0; padding-left:23px; }
  .rte ol { list-style:decimal outside; margin:5px 0; padding-left:26px; }
  .rte ul ul { list-style:circle; } .rte ul ul ul { list-style:square; }
  .rte li { margin:2px 0; }
  .rte li > ul, .rte li > ol { margin:2px 0; }
  .rte h3, .rte h4, .rte h5 { font-size:17px; font-weight:700; margin:9px 0 3px; }
  .rte code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .rte a { color:var(--accent); }
  .rte div { min-height:3px; }

  .cmt { background:var(--card); border-radius:13px; padding:11px 13px; margin-bottom:8px; box-shadow:var(--shadow); }
  .cmt .when { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .cmt-box { margin-top:12px; }

  /* ---------- Infos ---------- */
  .icard { display:flex; align-items:flex-start; gap:10px; background:var(--card); border-radius:15px;
           margin-bottom:9px; padding:13px 14px; box-shadow:var(--shadow); width:100%; text-align:left; }
  .icard .imain { flex:1; min-width:0; display:block; }
  .icard .ittl { display:block; font-size:15.5px; font-weight:600; line-height:1.3; word-break:break-word; }
  .icard .isub { display:block; font-size:12.5px; color:var(--muted); margin-top:3px;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icard .idots { display:flex; gap:3px; flex:0 0 auto; padding-top:5px; }
  .icard .idot { width:8px; height:8px; border-radius:50%; }
  .istar { color:var(--accent); }
  .ikv { margin-bottom:10px; }
  .ikv .ik { font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .ikv .iv { display:flex; align-items:center; gap:9px; width:100%; text-align:left;
             font-size:16px; padding:11px 13px; margin-top:5px; background:var(--card);
             border-radius:12px; box-shadow:var(--shadow); word-break:break-all; }
  .ikv .iv:active { background:var(--chip); }
  .ikv .isw { width:17px; height:17px; border-radius:5px; border:1px solid var(--line); flex:0 0 auto; }
  .ikv .ival { flex:1; min-width:0; }
  .ikv .icp { flex:0 0 auto; color:var(--muted); }
  .irow { display:flex; gap:6px; margin-bottom:7px; align-items:center; }
  .irow input { flex:1; min-width:0; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
                background:var(--card); color:var(--ink); font-family:inherit; font-size:16px; -webkit-appearance:none; }
  .irow input:focus { outline:none; border-color:var(--accent); }
  .irow input.ik-in { flex:0 0 38%; }
  .irow .idel { flex:0 0 auto; color:var(--muted); padding:8px 4px; font-size:17px; }
  .ihead { font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.25;
           margin:0 0 10px; word-break:break-word; }
  .isetup { font-size:15px; line-height:1.6; color:var(--muted); padding:26px 4px; }
  .isetup b { color:var(--ink); }
  .isetup code { background:var(--chip); border-radius:5px; padding:1px 5px; font-size:14px; }

  .md { font-size:15px; line-height:1.5; word-break:break-word; }
  .md ul { list-style:disc outside; margin:5px 0; padding-left:22px; }
  .md ol { list-style:decimal outside; margin:5px 0; padding-left:25px; }
  .md ul ul { list-style:circle; }
  .md h3, .md h4, .md h5 { font-size:15px; font-weight:700; margin:8px 0 3px; }
  .md code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .md a { color:var(--accent); }
  .md div { min-height:3px; }

  .wide { width:100%; padding:15px; border-radius:13px; font-size:16px; font-weight:600;
          margin-top:12px; background:var(--card); box-shadow:var(--shadow); }
  .wide:disabled { opacity:.4; }
  .wide.done { background:var(--accent); color:var(--on-accent); box-shadow:none; }
  .wide.del { color:var(--overdue); background:none; box-shadow:none; }

  /* ---------- Rueckmeldeleiste ----------
     Muss im Ruhezustand wirklich verschwinden: sie sitzt 74px ueber dem
     Rand, ein blosses Verschieben um die eigene Hoehe reicht dafuer nicht. */
  #snack { position:fixed; left:12px; right:12px; bottom:calc(74px + var(--bot)); z-index:70;
           background:var(--ink); color:var(--cream); border-radius:14px; padding:14px 16px;
           display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:600;
           box-shadow:0 6px 22px rgba(0,0,0,.3);
           visibility:hidden; opacity:0; transform:translateY(16px);
           transition:transform .26s cubic-bezier(.25,.8,.3,1), opacity .2s, visibility .26s; }
  #snack.on { visibility:visible; opacity:1; transform:none; }
  #snack span { flex:1; }
  #snack button { color:var(--accent); font-weight:800; padding:4px 2px; }
  #snack.err { background:var(--overdue); color:#fff; }
  #snack.err button { color:#fff; text-decoration:underline; }
</style>
</head>
