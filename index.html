<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mein Board</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mein Board">
<meta name="theme-color" id="themeColor" content="#FDF2E3">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Grundfarben hell. --cream/--ink/--accent setzt applyTheme() zur Laufzeit
     aus dem gewaehlten Preset; hier stehen nur die Startwerte. */
  :root {
    --cream:#FDF2E3; --ink:#253B44; --accent:#C46730; --accent-dark:#A9541F;
    --muted:#7C8A90; --line:rgba(37,59,68,.13); --card:#fff;
    --chip:rgba(37,59,68,.07); --overdue:#C0442E; --on-accent:#fff;
    --sheet:#fff; --shadow:0 2px 10px rgba(37,59,68,.07);
    --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
    /* Aus der Desktop-Sprache uebernommen: eine hellere Zweitfarbe fuer die
       Versalien-Zeilen, eine zartere Linie und die gemeinsame Beschleunigung. */
    --muted-hell:#8B959A; --line-zart:rgba(37,59,68,.07);
    /* Zahlen, Daten und Kuerzel im festen Schriftmass — sie sollen sich
       ausrichten und als Angabe lesbar sein, nicht als Prosa. */
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
    --rahmen:rgba(37,59,68,.22); --feld-radius:9px;
    --weich:cubic-bezier(.2,.8,.25,1);
    color-scheme: light;
  }
  /* Dunkle Flaechenfarben. Vor dem Start des Skripts entscheidet die
     Systemeinstellung, danach setzt applyTheme() die Klasse t-dark bzw. t-light. */
  @media (prefers-color-scheme: dark) {
    html:not(.t-light):not(.t-dark) {
      --cream:#191F22; --ink:#E9E4D8; --accent:#D07A40; --accent-dark:#B86630;
      --muted:#93A0A8; --line:rgba(255,255,255,.12); --card:#222A2E;
      --line-zart:rgba(255,255,255,.07); --rahmen:rgba(255,255,255,.20);
      --chip:rgba(255,255,255,.08); --overdue:#E5675C;
      --sheet:#232B2F; --shadow:0 2px 10px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  html.t-dark {
    --muted:#93A0A8; --line:rgba(255,255,255,.12); --card:#222A2E;
    --line-zart:rgba(255,255,255,.07); --rahmen:rgba(255,255,255,.20);
    --chip:rgba(255,255,255,.08); --overdue:#E5675C;
    --sheet:#232B2F; --shadow:0 2px 10px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior-y:none; }
  body {
    margin:0; background:var(--cream); color:var(--ink);
    /* Schriftwahl liegt auf --font. Alles andere steht auf font:inherit,
       deshalb reicht diese eine Stelle. Nur Schriften, die schon da sind —
       nichts nachladen, die App soll offline laufen. */
    font:16px/1.45 var(--font, -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:none; border:none; padding:0; cursor:pointer; }
  .hidden { display:none !important; }

  /* ---------- Kopfzeile ---------- */
  header {
    position:sticky; top:0; z-index:30; background:var(--cream);
    padding-top:var(--top); border-bottom:1px solid var(--line);
  }
  .hdr-row { display:flex; align-items:center; gap:2px; padding:8px 10px 10px 14px; }
  .hdr-row h1 { font-size:25px; font-weight:400; letter-spacing:-.02em; margin:0; flex:1; }
  .ico { width:38px; height:38px; display:flex; align-items:center; justify-content:center;
         border-radius:11px; color:var(--muted); flex:0 0 auto; }
  .ico:active { background:var(--chip); }
  .ico.on { color:var(--on-accent); background:var(--accent); }
  /* Code: einzeilig als Auszeichnung, mehrzeilig als Block mit Querlauf */
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em;
         background:var(--chip); border-radius:5px; padding:1px 5px; }
  pre.code { background:var(--chip); border-radius:11px; padding:11px 13px; margin:8px 0;
             overflow-x:auto; -webkit-overflow-scrolling:touch; }
  pre.code code { display:block; background:none; padding:0; border-radius:0;
                  white-space:pre; font-size:13px; line-height:1.45; }
  pre.code[data-lang]:before { content:attr(data-lang); display:block; font-size:10px;
                               font-weight:800; text-transform:uppercase; letter-spacing:.06em;
                               color:var(--muted); margin-bottom:6px; }

  /* Unteraufgaben */
  .sub { display:flex; align-items:center; gap:11px; padding:11px 2px; position:relative; }
  .sub + .sub:before { content:""; position:absolute; left:33px; right:0; top:0; height:1px; background:var(--line); }
  .sub-box { width:22px; height:22px; flex:0 0 auto; border-radius:50%; border:1.5px solid var(--line);
             display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; }
  .sub.fertig .sub-box { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .sub.fertig .sub-box:after { content:"✓"; }
  .sub-titel { flex:1; min-width:0; font-size:16px; word-break:break-word; }
  .sub.fertig .sub-titel { color:var(--muted); text-decoration:line-through; }
  .sub-weg { flex:0 0 auto; color:var(--muted); padding:8px 4px; font-size:15px; }
  .sub-hinweis { font-size:14px; color:var(--muted); padding:8px 2px; }
  .sub-neu { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .sub-neu input { flex:1; min-width:0; padding:10px 0; border-radius:0;
                   border:none; border-bottom:1px solid var(--line-zart);
                   background:none; color:var(--ink); font-family:inherit; font-size:16px; -webkit-appearance:none; }
  .sub-neu input::placeholder { color:var(--muted-hell); }
  .sub-neu input:focus { outline:none; border-bottom-color:var(--accent); }
  .sub-neu button { flex:0 0 auto; width:34px; height:34px; border-radius:0;
                    background:none; border:none;
                    color:var(--accent); font-size:20px; font-weight:400; }
  .sub-neu button:active { background:var(--accent); color:var(--on-accent); }

  /* Konfetti beim Erledigen */
  .confetti { position:fixed; width:7px; height:11px; border-radius:2px; z-index:80; pointer-events:none;
              animation:kf .9s cubic-bezier(.15,.6,.4,1) forwards; }
  @keyframes kf { to { transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }

  /* Ziehen zum Aktualisieren */
  #ptr { position:fixed; left:50%; top:calc(var(--top) + 4px); z-index:40;
         width:30px; height:30px; margin-left:-15px; border-radius:50%;
         background:var(--card); box-shadow:var(--shadow);
         display:flex; align-items:center; justify-content:center;
         opacity:0; pointer-events:none; transition:opacity .18s, transform .22s cubic-bezier(.25,.8,.3,1); }
  #ptr .ptr-kreis { width:15px; height:15px; border-radius:50%;
                    border:2px solid var(--line); border-top-color:var(--accent);
                    transition:transform .2s; }
  #ptr.bereit .ptr-kreis { transform:rotate(180deg); border-top-color:var(--accent); }
  #ptr.laeuft .ptr-kreis { animation:sp .7s linear infinite; }

  /* Zaehler fuer noch nicht weggeschriebene Aenderungen */
  #qBadge { display:none; flex:0 0 auto; min-width:19px; height:19px; padding:0 5px; border-radius:10px;
            background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:800;
            align-items:center; justify-content:center; margin-right:2px; }
  #qBadge.on { display:inline-flex; }
  .q-hinweis { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0 0 14px; }
  .q-liste { border-top:1px solid var(--line-zart); margin-bottom:4px; }
  .q-zeile { display:flex; align-items:baseline; gap:10px; padding:11px 0;
             border-bottom:1px solid var(--line-zart); font-size:13.5px; }
  .q-zeile.erste { color:var(--accent); }
  .q-v { margin-left:auto; flex:0 0 auto; font-size:9px; letter-spacing:.14em;
         text-transform:uppercase; color:var(--overdue); }
  .searchbar { padding:0 14px 10px; }
  .searchbar input {
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); font-size:16px; -webkit-appearance:none;
  }
  .searchbar input:focus { outline:none; border-color:var(--accent); }
  .statusbar { display:flex; gap:7px; overflow-x:auto; padding:0 14px 11px;
               scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .statusbar::-webkit-scrollbar { display:none; }
  .sbtn { flex:0 0 auto; padding:8px 14px; border-radius:11px; background:var(--chip);
          font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .sbtn.on { background:var(--accent); color:var(--on-accent); }
  .sbtn i { font-style:normal; opacity:.65; margin-left:5px; }

  /* Verteilungsbalken: optisch nur ein Haarstrich, die Polsterung sorgt
     aber fuer eine brauchbare Tippflaeche. */
  .dashbar { display:flex; align-items:center; gap:7px; width:100%; padding:2px 14px 11px; }
  .dashbar .segs { flex:1; display:flex; gap:3px; height:6px; }
  .dashbar .segs span { border-radius:3px; min-width:5px; }
  .dashbar .warn { width:8px; height:8px; border-radius:50%; background:var(--overdue); flex:0 0 auto; }
  .dash-row { display:flex; align-items:center; gap:11px; width:100%; padding:13px 12px;
              border-radius:13px; font-size:16px; font-weight:600; text-align:left; }
  .dash-row:active { background:var(--chip); }
  .dash-row .nm { flex:1; }
  .dash-row .pct { color:var(--muted); font-weight:600; font-size:13.5px; min-width:42px; text-align:right; }
  .dash-row .arr { color:var(--muted); font-weight:400; }
  .dash-sep { border-top:1px solid var(--line); margin:9px 0 3px; }

  /* ---------- Inhalt ---------- */
  main { padding:14px 14px calc(96px + var(--bot)); min-height:60vh; }
  .grp { margin-bottom:16px; }
  /* Gruppenkopf wie in der Desktop-Liste: eine echte Ueberschrift statt eines
     kleinen grauen Labels, mit Anzahl und zum Zuklappen. Volle Zeilenbreite,
     damit die Tippflaeche gross genug ist. */
  /* Gruppenkopf in der Desktop-Sprache: 19px in NORMALSTAERKE mit leicht
     negativer Laufweite, darunter eine Versalien-Zeile mit weiter Sperrung.
     Kein Fett, keine Flaeche — die Groesse allein traegt die Hierarchie. */
  .grp h2 { display:block; width:100%; text-align:left; margin:0;
            font-size:19px; font-weight:400; letter-spacing:-.015em; line-height:1.25;
            color:var(--ink); padding:26px 16px 10px; background:none; border:none; }
  .grp h2 small { display:block; font-size:10px; letter-spacing:.14em;
                  text-transform:uppercase; color:var(--muted); margin-top:7px; }
  .grp h2.zu small:after { content:" · zu"; }
  .grp.over h2, .grp.heute h2 { color:var(--accent); }

  /* Ruhige Liste: kein Gehaeuse je Zeile, Trennung nur durch Haarlinien,
     die am Text ausgerichtet sind. Farbe gibt es nur zweimal — der
     Statuspunkt links und ein rotes Datum, wenn es ueberfaellig ist. */
  /* Huelle je Zeile: darunter liegen die beiden Wisch-Flaechen, darueber
     die Zeile selbst, die beim Wischen zur Seite faehrt. */
  /* ---- Die Karte ---------------------------------------------------------
     Der Schatten sitzt am Wischbehaelter, nicht an der Karte: der Behaelter
     muss beschneiden, damit die Wischflaechen darunter verborgen bleiben, und
     wuerde einen Schatten der Karte mit abschneiden. Die Kante ist ein
     Innenschatten und wird davon nicht beruehrt. */
  .swipe { position:relative; overflow:hidden; margin:0 0 12px;
           border-radius:15px; box-shadow:var(--karte-schatten);
           transition:transform .07s ease, box-shadow .07s ease; }
  .swipe-bg { position:absolute; inset:0; display:flex; align-items:center;
              padding:0 22px; color:#fff; opacity:0; }
  .swipe-bg.erledigt { background:#6E9887; justify-content:flex-start; }
  .swipe-bg.spaeter  { background:var(--accent); justify-content:flex-end; }
  .karte-flaeche, .card {
    background:linear-gradient(152deg, var(--karte-1) 0%, var(--karte-2) 100%);
    box-shadow:var(--karte-kante); }
  .card { display:block; padding:15px 17px 13px; position:relative; }
  /* Der Glanz kommt von links oben — aus derselben Richtung wie der
     Schattenversatz. Auf dem Handy wandert er nicht: es gibt keinen Zeiger,
     dem er folgen koennte. */
  .card:before { content:""; position:absolute; inset:0; pointer-events:none;
                 background:linear-gradient(135deg, rgba(255,255,255,.95) 0%,
                            rgba(255,255,255,.22) 30%, rgba(255,255,255,0) 58%);
                 opacity:var(--karte-glanz); }
  .card > * { position:relative; }
  .card.zieht { transition:none; }
  .card.federt { transition:transform .22s cubic-bezier(.25,.8,.3,1); }
  /* Druck: kurzer, harter Weg wie bei einer steifen Karte auf dem Tisch.
     Gedrueckt wird der ganze Behaelter, sonst bliebe der Schatten stehen. */
  .swipe.gedrueckt { transform:scale(.972);
                     box-shadow:0 1px 1px rgba(0,0,0,.24); }

  /* ---- Innenleben, 1:1 wie am Desktop ---- */
  .k-kopf { display:flex; align-items:flex-start; gap:11px; }
  .k-titel { flex:1 1 auto; font-size:15.5px; font-weight:700; line-height:1.3;
             letter-spacing:-.012em; overflow-wrap:anywhere; hyphens:auto; }
  .k-marke { flex:0 0 auto; width:32px; height:32px; border-radius:50%;
             display:flex; align-items:center; justify-content:center;
             background:var(--karte-marke); border:1px solid var(--karte-rand);
             box-shadow:0 1px 3px rgba(0,0,0,.10); }
  /* Die Zeichen tragen sonst vertical-align:-2px, damit sie in einer Textzeile
     auf der Schriftlinie sitzen. In einem Kreis ist das genau falsch: dort
     zaehlt die Mitte, nicht die Schriftlinie. */
  .k-marke .ic, .k-marke .ic-farbe, .k-marke svg { display:block; vertical-align:0; margin:0; }
  .k-marke .ic-farbe { line-height:0; }
  .k-felder { display:flex; gap:26px; margin-top:15px; }
  .k-lab { display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
           text-transform:uppercase; color:var(--muted-hell); margin-bottom:4px; }
  .k-wert { display:block; font-family:var(--mono); font-size:13px; color:var(--ink);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .k-wert.overdue { color:var(--overdue); }
  .k-wert.today { color:var(--accent); }
  .k-wert.leer { color:var(--muted-hell); }
  .k-fuss { display:flex; align-items:flex-end; gap:12px; margin-top:15px; }
  .k-status { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
              text-transform:uppercase; color:var(--muted-hell); white-space:nowrap; }
  .k-status.blockiert { color:var(--overdue); }
  .k-fort { flex:1 1 auto; min-width:0; }
  .k-stand { font-family:var(--mono); font-size:11px; color:var(--muted-hell);
             text-align:right; margin-bottom:7px; white-space:nowrap; }
  .k-balken { height:4px; border-radius:2px; background:var(--karte-rille); overflow:hidden; }
  .k-balken i { display:block; height:100%; border-radius:2px; background:var(--k-farbe, var(--accent)); }
  .k-doppel { position:relative; flex:0 0 auto; width:36px; height:22px; }
  .k-doppel i, .k-doppel u { position:absolute; top:0; width:22px; height:22px; border-radius:50%; }
  .k-doppel u { right:0; background:var(--karte-rille); }
  .k-doppel i { left:0; background:var(--k-farbe, var(--accent)); }
  .k-hk { flex:0 0 auto; width:16px; height:16px; padding:0; background:none;
          border:1px solid var(--muted-hell); border-radius:50%; margin-top:3px; }
  .k-hk:active { background:var(--accent); border-color:var(--accent); }
  .card .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-left:2px;
               align-self:flex-start; margin-top:7px; }
  .card .body { flex:1; min-width:0; }
  .card .ttl { font-size:16px; font-weight:400; line-height:1.35; letter-spacing:-.008em;
               overflow-wrap:anywhere; hyphens:auto; }
  /* Einzeilig halten — lieber abschneiden als den Rhythmus brechen */
  /* Zweitzeile als Versalien mit weiter Sperrung — dieselbe Rolle wie .li-unter
     am Desktop. Kein Umbruch: lieber abschneiden als den Rhythmus brechen. */
  .card .meta { display:flex; align-items:center; gap:7px;
                font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
                color:var(--muted-hell); margin-top:5px; line-height:1.5;
                white-space:nowrap; overflow:hidden; }
  .card .meta .ic { flex:0 0 auto; }
  .card .meta .tg, .card .meta .li-blk { overflow:hidden; text-overflow:ellipsis; }
  .card .meta .sep { margin:0 7px; opacity:.5; }
  /* Status und Datum bleiben antippbar — nur ohne farbige Flaeche. Die
     Polsterung vergroessert die Tippflaeche, ohne das Layout zu aendern. */
  .card .meta .act { color:var(--muted-hell); font-size:9.5px; font-weight:400;
                     letter-spacing:.15em; text-transform:uppercase;
                     padding:9px 0; margin:-9px 0; }
  .card .meta .act.over { color:var(--overdue); }
  .card .meta .act.today { color:var(--accent); }
  .card .meta .tg { font-weight:400; }
  /* Blockiert gehoert an den Titel, nicht in die Aufzaehlung: es betrifft rund ein
     Fuenftel der Tickets und soll auffallen, ohne eine eigene Spalte zu bekommen. */
  .card .ttl-zeile { display:flex; align-items:center; gap:7px; min-width:0; }
  .card .ttl-zeile .ttl { min-width:0; }
  .card .li-blk { flex:0 0 auto; font-size:9.5px; font-weight:400; letter-spacing:.15em;
                  text-transform:uppercase; color:var(--accent); background:none; }
  .card .done-btn { flex:0 0 auto; width:34px; display:flex; align-items:center; justify-content:center; }
  .card .circ { width:13px; height:13px; border-radius:50%; border:1px solid var(--muted-hell); }
  .card .done-btn:active .circ { background:var(--accent); border-color:var(--accent); }
  .card.going { opacity:0; transform:translateX(50px); transition:opacity .2s, transform .2s; }

  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
          border-radius:8px; padding:4px 9px; background:var(--chip); color:var(--muted); }
  .pill.dt.over { background:rgba(192,68,46,.15); color:var(--overdue); }
  .pill.dt.today { background:rgba(196,103,48,.17); color:var(--accent); }
  .pill.cm { background:none; padding:4px 2px; }

  .empty { text-align:center; color:var(--muted); padding:46px 20px; font-size:15px; }
  .loading { text-align:center; color:var(--muted); padding:60px 20px; }
  .spin { width:22px; height:22px; border:2.5px solid var(--line); border-top-color:var(--accent);
          border-radius:50%; margin:0 auto 12px; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ---------- Navigation unten + FAB ---------- */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
        background:var(--cream); border-top:1px solid var(--line); padding-bottom:var(--bot); }
  nav button { flex:1; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center;
               gap:5px; font-size:9px; font-weight:400; letter-spacing:.14em;
               text-transform:uppercase; color:var(--muted); }
  nav button.on { color:var(--accent); }
  /* Symbole stehen im Fliesstext — dort brauchen sie eine Grundlinie und
     einen Abstand zum Wort. In Flex-Zeilen macht das der gap, deshalb dort aus. */
  .ic { display:inline-block; vertical-align:-2px; flex:0 0 auto; margin-right:6px; }
  .card .meta .ic { margin-right:0; }
  .nic { width:19px; height:19px; }
  .nic.gross { width:24px; height:24px; }
  /* Das Plus in der Mitte traegt keine Beschriftung — es ist die einzige
     Aktion in der Leiste, die etwas anlegt statt umzuschalten. */
  #navPlus { color:var(--accent); }
  #navPlus:active { opacity:.6; }


  /* ---------- Bottom-Sheet ----------
     Muss ueber der Detailansicht (z-index 50) liegen, sonst oeffnet sich
     die Status- und Datumsauswahl unsichtbar dahinter. */
  .scrim { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.35);
           opacity:0; pointer-events:none; transition:opacity .22s; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--sheet);
           border-radius:22px 22px 0 0; padding:8px 16px calc(20px + var(--bot));
           transform:translateY(101%); transition:transform .26s cubic-bezier(.25,.8,.3,1);
           max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .sheet.on { transform:none; }
  .grab { width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
  .sheet h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
              color:var(--muted); margin:0 0 11px; }
  .opt { display:flex; align-items:center; gap:11px; width:100%; padding:14px 12px;
         border-radius:13px; font-size:16px; font-weight:600; text-align:left; }
  .opt:active, .opt.on { background:var(--chip); }
  .opt .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .opt .ck { margin-left:auto; color:var(--accent); font-weight:800; }
  .quick { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .quick button { flex:1 1 auto; padding:13px 10px; border-radius:12px; background:var(--chip);
                  font-size:15px; font-weight:600; white-space:nowrap; }
  .quick button:active { background:var(--accent); color:var(--on-accent); }
  .sheet input[type=date] {
    width:100%; padding:13px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); font-size:16px; -webkit-appearance:none; margin-bottom:6px;
  }

  /* ---------- Aussehen ---------- */
  .seg { display:flex; gap:5px; background:var(--chip); border-radius:13px; padding:4px; margin-bottom:18px; }
  .seg button { flex:1; padding:11px 6px; border-radius:10px; font-size:14.5px; font-weight:700; color:var(--muted); }
  .seg button.on { background:var(--accent); color:var(--on-accent); }
  /* Fuenf Schriften statt drei Modi: auf einem schmalen Bildschirm wuerden die
     Namen sonst umbrechen oder abgeschnitten. Kleiner setzen und knapper polstern. */
  .seg.schriftwahl button { font-size:12.5px; padding:11px 2px; font-weight:600; }
  .presets { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .pcard { border:2px solid var(--line); border-radius:15px; padding:12px; text-align:left; }
  .pcard.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .pcard .sw { display:flex; gap:5px; margin-bottom:10px; }
  .pcard .sw span { width:21px; height:21px; border-radius:6px; flex:0 0 auto; }
  .pcard .nm { font-size:13px; font-weight:700; }

  /* ---------- Detailansicht ---------- */
  .full { position:fixed; inset:0; z-index:50; background:var(--cream);
          transform:translateY(100%); transition:transform .27s cubic-bezier(.25,.8,.3,1);
          display:flex; flex-direction:column; }
  .full.on { transform:none; }
  .full-hdr { display:flex; align-items:center; gap:8px; padding:calc(var(--top) + 8px) 12px 10px;
              border-bottom:1px solid var(--line); flex:0 0 auto; }
  .full-hdr .t { flex:1; font-size:10px; font-weight:400; letter-spacing:.16em;
                 text-transform:uppercase; color:var(--muted); text-align:center; }
  .full-hdr button { padding:8px 10px; font-size:10px; font-weight:400; letter-spacing:.14em;
                     text-transform:uppercase; color:var(--accent);
                     border-radius:0; white-space:nowrap; }
  .full-hdr button:disabled { opacity:.4; }
  .full-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
               padding:16px 16px calc(28px + var(--bot)); }
  .f-label { font-size:9.5px; font-weight:400; text-transform:uppercase; letter-spacing:.15em;
             color:var(--muted-hell); margin:34px 0 10px; }
  .rowbtns.erste { margin-top:20px; }
  /* Kopf: Symbol und Titel auf einer Grundlinie. Das Symbol traegt den Tag und
     oeffnet dessen Auswahl — deshalb sitzt es dort, wo es etwas aussagt. */
  /* ---- Der Kopf des Detailfensters ist die Karte ------------------------
     Auf der Liste liegt eine Karte flach. Hier ist sie herausgenommen — sie
     schwebt, und ein Lichtstreifen zieht ueber sie hinweg. Die Werte darauf
     sind Knoepfe: antippen oeffnet Datum bzw. Status. */
  .d-karte { position:relative; border-radius:15px; padding:18px 18px 15px;
             margin:0 0 20px; border:1px solid var(--karte-rand);
             box-shadow:var(--karte-hoch), var(--karte-kante);
             animation:dSchweben 7s ease-in-out infinite; overflow:hidden; }
  .d-karte:after { content:""; position:absolute; inset:0; pointer-events:none;
                   background:linear-gradient(115deg, rgba(255,255,255,0) 34%,
                              var(--glanzband) 47%, var(--glanzband-2) 53%,
                              rgba(255,255,255,0) 66%);
                   background-size:280% 280%; background-position:100% 0%;
                   animation:dLicht 9s ease-in-out infinite alternate; }
  .d-karte > * { position:relative; z-index:1; }
  @keyframes dSchweben {
    0%,100% { transform:translateY(1.5px) rotate(.12deg); }
    50%     { transform:translateY(-1.5px) rotate(-.12deg); }
  }
  @keyframes dLicht { from { background-position:108% -8%; } to { background-position:-8% 108%; } }
  .d-karte #dTitle { flex:1 1 auto; min-width:0; border:none; background:none; padding:0;
                     font-family:inherit; font-size:19px; font-weight:700;
                     letter-spacing:-.015em; line-height:1.25; color:var(--ink);
                     resize:none; overflow:hidden; }
  .d-karte #dTitle:focus { outline:none; }
  /* Die Werte sind antippbar. Die Haarlinie sagt das, ohne aus der Karte ein
     Formular zu machen. */
  .d-karte .k-wert { background:none; border:none; border-bottom:1px solid var(--karte-rand);
                     padding:0 0 4px; width:100%; text-align:left; border-radius:0; }
  .d-karte .k-marke { background:var(--karte-marke); }
  .d-karte .k-marke.leer { opacity:.55; }
  @media (prefers-reduced-motion: reduce) {
    .d-karte { animation:none; }
    .d-karte:after { animation:none; opacity:.55; }
  }
  .f-label:first-child { margin-top:0; }
  #dTitle {
    width:100%; border:none; background:none; font-size:22px; font-weight:400;
    letter-spacing:-.02em; padding:0; resize:none; overflow:hidden; line-height:1.3;
  }
  #dTitle:focus { outline:none; }
  /* Keine gefuellten Kacheln mehr: die Auswahlfelder sind Zeilen, getrennt
     durch Haarlinien. Getippt wird auf die ganze Zeile, die Flaeche fehlt nur
     optisch — die Tippflaeche bleibt gleich gross. */
  .rowbtns { display:flex; flex-direction:column; gap:0; }
  .rowbtns .pick { padding:13px 0; border-radius:0; background:none;
                   box-shadow:none; font-size:16px; font-weight:400; text-align:left;
                   display:flex; align-items:center; gap:10px; min-width:0;
                   border-bottom:1px solid var(--line-zart); }
  .rowbtns .pick:last-child { border-bottom:none; }
  .rowbtns .pick:active { background:var(--chip); }
  .rowbtns .pick span.lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tagrow { display:flex; flex-wrap:wrap; gap:7px; }
  .tagopt { font-size:10px; font-weight:400; letter-spacing:.12em; text-transform:uppercase;
            padding:8px 12px; border-radius:var(--feld-radius);
            border:1px solid var(--rahmen); color:var(--muted); background:none; }
  .tagopt.on { border-color:var(--accent); color:var(--accent); background:none; }
  .grp-lbl { font-size:9px; font-weight:400; text-transform:uppercase; letter-spacing:.15em;
             color:var(--muted-hell); margin:14px 0 7px; }

  /* ---------- Formatier-Editor ---------- */
  .rte {
    min-height:120px; padding:4px 0 12px; border:none; border-bottom:1px solid var(--line-zart);
    border-radius:0; background:none; font-size:16px; line-height:1.5; outline:none;
    word-break:break-word; -webkit-user-select:text; user-select:text;
  }
  .rte:focus { border-bottom-color:var(--accent); }
  .rte.sm { min-height:64px; }
  .rte.is-empty:before { content:attr(data-placeholder); color:var(--muted-hell); pointer-events:none; }
  .rte ul { list-style:disc outside; margin:5px 0; padding-left:23px; }
  .rte ol { list-style:decimal outside; margin:5px 0; padding-left:26px; }
  .rte ul ul { list-style:circle; } .rte ul ul ul { list-style:square; }
  .rte li { margin:2px 0; }
  .rte li > ul, .rte li > ol { margin:2px 0; }
  .rte h3, .rte h4, .rte h5 { font-size:17px; font-weight:500; margin:9px 0 3px; }
  .rte code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .rte a { color:var(--accent); }
  .rte div { min-height:3px; }

  .cmt { background:none; border-radius:0; padding:12px 0; margin-bottom:0; box-shadow:none;
         border-bottom:1px solid var(--line-zart); }
  .cmt:last-of-type { border-bottom:none; }
  .cmt .when { font-size:9px; font-weight:400; letter-spacing:.15em; text-transform:uppercase;
               color:var(--muted-hell); margin-bottom:5px; }
  .cmt-box { margin-top:12px; }

  /* ---------- Infos ----------
     Gleiche Sprache wie die Aufgabenliste: keine gefuellten Kacheln, Trennung
     durch Haarlinien, Zweitschriften als Versalien, Symbol statt Farbpunkt. */
  .icard { display:flex; align-items:center; gap:12px; background:none; border-radius:0;
           margin-bottom:0; padding:12px 16px; box-shadow:none; width:100%; text-align:left;
           border-bottom:1px solid var(--line-zart); }
  .icard:active { background:var(--chip); }
  .icard .imain { flex:1; min-width:0; display:block; }
  .icard .ittl { display:block; font-size:16px; font-weight:400; line-height:1.35;
                 letter-spacing:-.008em; overflow-wrap:anywhere; }
  .icard .isub { display:block; font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
                 color:var(--muted-hell); margin-top:5px; line-height:1.5;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icard .idots { display:flex; align-items:center; gap:7px; flex:0 0 auto; color:var(--muted-hell); }
  .icard .idots .ic { margin-right:0; }
  .istar { color:var(--accent); }

  /* Wert zum Antippen: Haarlinie statt Kasten, Beschriftung als Versalie */
  .ikv { margin-bottom:0; border-bottom:1px solid var(--line-zart); padding:12px 0; }
  .ikv .ik { font-size:9.5px; font-weight:400; text-transform:uppercase; letter-spacing:.15em;
             color:var(--muted-hell); }
  .ikv .iv { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
             font-size:16px; padding:6px 0 0; margin-top:0; background:none;
             border-radius:0; box-shadow:none; word-break:break-all; }
  .ikv .iv:active { background:var(--chip); }
  .ikv .isw { width:15px; height:15px; border-radius:3px; border:1px solid var(--rahmen); flex:0 0 auto; }
  .ikv .ival { flex:1; min-width:0; }
  .ikv .icp { flex:0 0 auto; color:var(--muted-hell); font-size:9.5px; letter-spacing:.15em;
              text-transform:uppercase; }
  .itags { display:flex; flex-wrap:wrap; gap:14px; margin:6px 0 22px; }
  .itag { font-size:9.5px; font-weight:400; letter-spacing:.15em; text-transform:uppercase;
          color:var(--muted-hell); display:inline-flex; align-items:center; }

  .irow { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .irow input { flex:1; min-width:0; padding:10px 0; border-radius:0; border:none;
                border-bottom:1px solid var(--line-zart);
                background:none; color:var(--ink); font-family:inherit; font-size:16px; -webkit-appearance:none; }
  .irow input::placeholder { color:var(--muted-hell); }
  .irow input:focus { outline:none; border-bottom-color:var(--accent); }
  .irow input.ik-in { flex:0 0 38%; }
  .irow .idel { flex:0 0 auto; color:var(--muted-hell); padding:8px 4px; font-size:17px; }

  .ihead { font-size:22px; font-weight:400; letter-spacing:-.02em; line-height:1.3;
           margin:0 0 4px; overflow-wrap:anywhere; }
  .isetup { font-size:15px; line-height:1.6; color:var(--muted); padding:26px 4px; }
  .isetup b { color:var(--ink); }
  .isetup code { background:none; border-bottom:1px solid var(--line-zart); border-radius:0;
                 padding:1px 2px; font-size:14px; }

  .md { font-size:15px; line-height:1.5; word-break:break-word; }
  .md ul { list-style:disc outside; margin:5px 0; padding-left:22px; }
  .md ol { list-style:decimal outside; margin:5px 0; padding-left:25px; }
  .md ul ul { list-style:circle; }
  .md h3, .md h4, .md h5 { font-size:15px; font-weight:700; margin:8px 0 3px; }
  .md code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .md a { color:var(--accent); }
  .md div { min-height:3px; }

  /* Knoepfe sind Text, keine Flaechen — wie am Desktop. Der Rahmen bleibt nur
     dort, wo etwas angetippt werden SOLL und sonst nichts es anzeigt. */
  .wide { width:100%; padding:13px; border-radius:var(--feld-radius); font-size:10px;
          font-weight:400; letter-spacing:.14em; text-transform:uppercase;
          margin-top:16px; background:none; box-shadow:none;
          border:none; color:var(--muted); }
  .wide:disabled { opacity:.35; }
  .wide.done { background:none; border:1px solid var(--accent); color:var(--accent); box-shadow:none; }
  .wide.del { color:var(--overdue); border-color:transparent; background:none; box-shadow:none; }

  /* ---------- Rueckmeldeleiste ----------
     Muss im Ruhezustand wirklich verschwinden: sie sitzt 74px ueber dem
     Rand, ein blosses Verschieben um die eigene Hoehe reicht dafuer nicht. */
  #snack { position:fixed; left:12px; right:12px; bottom:calc(74px + var(--bot)); z-index:70;
           background:var(--ink); color:var(--cream); border-radius:14px; padding:14px 16px;
           display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:600;
           box-shadow:0 6px 22px rgba(0,0,0,.3);
           visibility:hidden; opacity:0; transform:translateY(16px);
           transition:transform .26s cubic-bezier(.25,.8,.3,1), opacity .2s, visibility .26s; }
  #snack.on { visibility:visible; opacity:1; transform:none; }
  #snack span { flex:1; }
  #snack button { color:var(--accent); font-weight:800; padding:4px 2px; }
  #snack.err { background:var(--overdue); color:#fff; }
  #snack.err button { color:#fff; text-decoration:underline; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <h1 id="vTitle">Heute</h1>
    <button class="ico" id="bSearch" aria-label="Suchen">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.2-4.2"/></svg>
    </button>

    </button>

<main id="main"><div class="loading"><div class="spin"></div>Lädt…</div></main>



<nav>

    Aufgaben
  </button>
  <button id="navPlus" aria-label="Neues Ticket">

  </button>
  <button data-view="infos">
    <svg class="nic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 1.5h7l3 3v11H3z"/><path d="M9.6 1.6v3.2h3.2"/><path d="M5.4 8.4h5.2"/><path d="M5.4 11.2h5.2"/></svg>
    Infos
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<div class="full" id="detail">
  <div class="full-hdr">
    <button id="dClose">Abbrechen</button>
    <div class="t" id="dHead">Ticket</div>
    <button id="dSave">Sichern</button>
  </div>
  <div class="full-body" id="dBody"></div>
</div>

<div id="snack"><span id="snackText"></span><button id="snackBtn"></button></div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     Stammdaten — identisch zum Desktop-Board (mein-board.html)
     ===================================================================== */
  var STATUSES = ["Backlog","Do Next","Ongoing","Blocked","Waiting for Input","Done"];
  var OPEN_STATUSES = STATUSES.filter(function(s){ return s !== "Done"; });
  var STATUS_LABELS = { "Backlog":"Offen", "Do Next":"Als Nächstes", "Ongoing":"In Arbeit",
                        "Blocked":"Blockiert", "Waiting for Input":"Wartet auf Input", "Done":"Erledigt" };
  function statusLabel(s){ return STATUS_LABELS[s] || s; }

  var TAG_GROUPS = [
    { name:"MYO",           tags:["SLS","FIN","MKT","OPS","SF","BIZDEV","PROD","ANDERE"] },
    { name:"PRIVAT",        tags:["EHE","SOLO"] },
    { name:"WIEDERKEHREND", tags:["GEBURTSTAGE","ARBEIT"] }
  ];
  /* Pixel-Figuren je Tag (Tiny RPG Asset Pack). Abgespielt rein per CSS:
     jede Animation ist ein waagerechtes Sprite-Sheet aus 100x100-Bildern.
     Die Figur belegt darin nur einen kleinen Teil — gemeinsamer Ausschnitt
     ueber alle zwoelf: x 31, y 28, 39x36. */
  /* Symbolsatz wortgleich aus der Desktop-Fassung uebernommen, damit beide

  var ICON_PFADE = {
    // Tag-Zeichen

    mappe:      "M1.8 5h12.4v8.2H1.8zM5.6 5V3.4a1 1 0 0 1 1-1h2.8a1 1 0 0 1 1 1V5M1.8 8.6h12.4",
    geld:       "M1.5 4h13v8h-13zM8 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3M4 8h.01M12 8h.01",
    megafon:    "M2 6.5v3l8 3.5V3L2 6.5zM2 6.5H1.2v3H2M11.5 6v4M13.5 5v6",
    zahnrad:    "M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8M8 1.5v1.6M8 12.9v1.6M2.9 2.9l1.2 1.2M11.9 11.9l1.2 1.2M1.5 8h1.6M12.9 8h1.6M2.9 13.1l1.2-1.2M11.9 4.1l1.2-1.2",
    wolke:      "M4.5 12.5a3 3 0 0 1-.3-6 4 4 0 0 1 7.6 1.1 2.5 2.5 0 0 1-.3 4.9z",

    ring:       "M8 14.2c-3-2.2-6-4.4-6-7.2A3.4 3.4 0 0 1 8 4.8a3.4 3.4 0 0 1 6 2.2c0 2.8-3 5-6 7.2z",
    person:     "M8 2.5a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2M2.8 14v-.7A4 4 0 0 1 6.8 9.3h2.4a4 4 0 0 1 4 4V14",
    geschenk:   "M1.8 7.5h12.4v6.2H1.8zM1 5h14v2.5H1zM8 5v8.7M8 5S6.8 2 5.2 2a1.6 1.6 0 0 0 0 3M8 5s1.2-3 2.8-3a1.6 1.6 0 0 1 0 3",
    wiederholen:"M13.5 6.5A5.5 5.5 0 0 0 3.4 4.4M2.5 9.5a5.5 5.5 0 0 0 10.1 2.1M13.5 2.5v4h-4M2.5 13.5v-4h4",
    marke:      "M2.5 2.5h5.2l6 6-5.2 5.2-6-6zM5.4 5.4h.01",
    // Zeichen der Oberfläche
    hakenkasten:"M2 2.5h12v11H2zM4.8 8.2 7 10.4l4.2-4.4",
    sprechblase:"M14 10.5a1.8 1.8 0 0 1-1.8 1.8H4.6L1.5 15V3.3A1.8 1.8 0 0 1 3.3 1.5h8.9A1.8 1.8 0 0 1 14 3.3z",
    kalender:   "M2 3.5h12v11H2zM2 6.8h12M5.2 1.5v3M10.8 1.5v3",
    plus:       "M8 3v10M3 8h10",

    // Warteschlange, die sich selbst um Wiederholungen kuemmert — sonst

        // ein Anhaengen im Sheet ueber 30 Sekunden, und ein Abbruch verloere die Aenderung.
