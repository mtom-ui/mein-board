  function dashSheet(){
    var st = dashStats();
    var scope = (filterTags.length || query.trim()) ? " (gefiltert)" : "";
    var html = '<h3>Verteilung' + scope + '</h3>';
    OPEN_STATUSES.forEach(function(s,i){
      var pct = st.total ? Math.round(st.counts[i] / st.total * 100) : 0;
      html += '<button class="dash-row" data-jump="'+esc(s)+'">'
        + '<span class="dot" style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:'+STATUS_COLORS[s]+'"></span>'
        + '<span class="nm">'+esc(statusLabel(s))+'</span>'
        + '<b>'+st.counts[i]+'</b>'
        + '<span class="pct">'+pct+' %</span>'
        + '<span class="arr">›</span></button>';
    });
    html += '<div class="dash-sep"></div>';
    html += st.overdue
      ? '<button class="dash-row" id="jumpOver" style="color:var(--overdue)">'
        + '<span class="dot" style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--overdue)"></span>'
        + '<span class="nm">'+st.overdue+' überfällig</span><span class="arr">›</span></button>'
      : '<div class="dash-row" style="color:var(--muted)">'
        + '<span class="dot" style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--line)"></span>'
        + '<span class="nm">Nichts überfällig</span></div>';
    openSheet(html);

    $("sheet").querySelectorAll("[data-jump]").forEach(function(b){
      b.addEventListener("click", function(){
        closeSheet();
        setView("today");        // es gibt nur noch die Liste
      });
    });
    if ($("jumpOver")) $("jumpOver").addEventListener("click", function(){
      closeSheet();
      setView("today");
    });
  }

  function themeSheet(){
    var modes = [["auto","Automatisch"],["light","Hell"],["dark","Dunkel"]];
    var html = '<h3>Aussehen</h3><div class="seg">'
      + modes.map(function(m){
          return '<button data-mode="'+m[0]+'"'+(themeMode===m[0]?' class="on"':'')+'>'+m[1]+'</button>';
        }).join("")
      + '</div>'
      + '<div class="seg schriftwahl">'
      + SCHRIFTEN.map(function(f){
          // Jeder Knopf in seiner eigenen Schrift — sonst raet man beim Auswaehlen
          return '<button data-font="'+f.id+'"'+(schriftId===f.id?' class="on"':'')
               + ' style="font-family:'+f.stack+'">'+f.name+'</button>';
        }).join("")
      + '</div>'
      + '<div class="presets">'
      + PRESETS.map(function(p,i){
          var b = DARK ? p.dark : p.light;
          return '<button class="pcard'+(i===themeIdx?" on":"")+'" data-idx="'+i+'" '
               + 'style="background:'+b.bg+';color:'+b.ink+'">'
               + '<div class="sw"><span style="background:'+b.accent+'"></span>'
               + '<span style="background:'+b.ink+'"></span>'
               + '<span style="background:'+mixHex(b.bg,b.ink,0.12)+'"></span></div>'
               + '<div class="nm">'+esc(p.name)+'</div></button>';
        }).join("")
      + '</div>';
    openSheet(html);
    $("sheet").querySelectorAll("[data-mode]").forEach(function(b){
      b.addEventListener("click", function(){
        themeMode = b.dataset.mode; applyTheme(); saveTheme(); render(); themeSheet();
      });
    });
    $("sheet").querySelectorAll("[data-font]").forEach(function(b){
      b.addEventListener("click", function(){
        schriftId = b.dataset.font; applySchrift(); saveTheme(); themeSheet();
      });
    });
    $("sheet").querySelectorAll("[data-idx]").forEach(function(b){
      b.addEventListener("click", function(){
        themeIdx = parseInt(b.dataset.idx); applyTheme(); saveTheme(); render(); themeSheet();
      });
    });
  }

  /* =====================================================================
     Detailansicht
     ===================================================================== */
  function openDetail(t){
    editing = t;
    draft = t ? { title:t.title, description:t.description, dueDate:t.dueDate,
                  status:t.status, tags:(t.tags||[]).slice(), comment:"" }
              : { title:"", description:"", dueDate:todayISO(),
                  status:"Backlog", tags:[], comment:"" };
    infoMode = null;                       // Kopfknoepfe aus dem Info-Modus zuruecksetzen
    $("dHead").textContent = t ? "Ticket" : "Neues Ticket";
    $("dClose").textContent = "Abbrechen";
    $("dSave").textContent = "Sichern";
    renderDetail();
    $("detail").classList.add("on");
    // Die Titelhoehe erst messen, wenn der Dialog im Bild ist — ausserhalb
    // liefert scrollHeight einen zu grossen Wert und reisst eine Luecke auf.
    requestAnimationFrame(function(){ var ta = $("dTitle"); if (ta) autoGrow(ta); });
    if (!t) setTimeout(function(){ $("dTitle").focus(); }, 320);
  }
  function closeDetail(){ $("detail").classList.remove("on"); editing = null; draft = null; }

  /* Inhalte der Formatier-Editoren in den Entwurf uebernehmen, bevor die
     Ansicht neu aufgebaut wird — sonst geht Getipptes verloren. */
  function syncEditors(){
    if (!draft) return;
    if ($("dDesc")) draft.description = htmlToMd($("dDesc"));
    if ($("dCmt"))  draft.comment = htmlToMd($("dCmt"));
  }

  function tagKnopfText(tags){
    if (!tags || !tags.length) return "Tags wählen";
    return tags.map(function(tg){ return iconFuerTag(tg,13) + tg; }).join(" · ");
  }
  /* Tags liegen jetzt in einem Blatt wie Status und Faelligkeit — im Ticket
     nahmen die vier Gruppen mit allen Knoepfen fast einen halben Bildschirm ein,
     obwohl sie meist nur beim Anlegen gesetzt werden. */
  function tagSheet(){
    var html = '<h3>Tags</h3>';
    TAG_GROUPS.forEach(function(g){
      html += '<div class="grp-lbl">'+esc(g.name)+'</div><div class="tagrow">'
        + g.tags.map(function(tg){
            var on = draft.tags.indexOf(tg) >= 0;
            return '<button class="tagopt'+(on?" on":"")+'" data-tag="'+esc(tg)+'"'
                 + (on ? ' style="background:'+g.color+';color:'+onColor(g.color)+'"' : '') + '>'
                 + iconFuerTag(tg,13) + esc(tg) + '</button>';
          }).join("") + '</div>';
    });
    html += '<button class="wide done" id="tagOk">Fertig</button>';
    openSheet(html);
    $("sheet").querySelectorAll("[data-tag]").forEach(function(b){
      b.addEventListener("click", function(){
        var tg = b.dataset.tag, i = draft.tags.indexOf(tg), on = i < 0;
        if (on) draft.tags.push(tg); else draft.tags.splice(i, 1);
        b.classList.toggle("on", on);
        b.style.background = on ? tagColor(tg) : "";
        b.style.color = on ? onColor(tagColor(tg)) : "";
        var lbl = $("dTagsBtn") && $("dTagsBtn").querySelector(".lbl");
        if (lbl) lbl.innerHTML = tagKnopfText(draft.tags);
      });
    });
    $("tagOk").addEventListener("click", closeSheet);
  }
  function renderDetail(){
    var t = editing, d = draft;
    var sc = STATUS_COLORS[d.status] || ACCENT;
    // Das Tag-Symbol steht links neben dem Titel und ist zugleich der Knopf,
    // der die Tag-Auswahl oeffnet. Ohne Tag ein blasses Platzhalter-Zeichen,
    // damit die Tippflaeche bleibt und der Titel nicht springt.
    var tagSym = (d.tags && d.tags.length) ? iconFuerTag(d.tags[0], 19) : icon("marke", 19);
    // Der Kopf IST die Karte — dieselbe wie in der Liste, nur beschreibbar.
    // Sie schwebt und zeigt ein wanderndes Licht: auf der Liste liegt eine
    // Karte, hier ist sie herausgenommen und wird gehalten.
    var farbe = (d.tags && d.tags.length && TAG_COLOR[d.tags[0]]) ? TAG_COLOR[d.tags[0]] : "var(--accent)";
    var stD = t ? subStats(t) : { done:0, total:0 };
    var standD = stD.total ? (stD.done+"/"+stD.total+" erledigt") : "—";
    var breiteD = stD.total ? Math.round(stD.done/stD.total*100) : 6;
    var dd = kartenDatum(d.dueDate);
    var html = '<div class="d-karte karte-flaeche" id="dKarte" style="--k-farbe:'+farbe+'">'
      +   '<div class="k-kopf">'
      +     '<textarea id="dTitle" class="k-titel" rows="1" placeholder="Titel des Tickets">'+esc(d.title)+'</textarea>'
      +     '<button class="k-marke d-tag'+((d.tags&&d.tags.length)?"":" leer")+'" id="dTagsBtn" aria-label="Tags" style="color:'+farbe+'">'+tagSym+'</button>'
      +   '</div>'
      +   '<div class="k-felder">'
      +     '<div><span class="k-lab">Fällig</span>'
      +       '<button class="k-wert '+dd.cls+'" id="dDate">'+esc(dd.txt)+'</button></div>'
      +     '<div><span class="k-lab">Status</span>'
      +       '<button class="k-wert" id="dStatus">'+esc(statusLabel(d.status))+'</button></div>'
      +   '</div>'
      +   '<div class="k-fuss">'
      +     '<div class="k-fort"><div class="k-stand">'+esc(standD)+'</div>'
      +     '<div class="k-balken"><i style="width:'+breiteD+'%'+(stD.total?"":";opacity:.35")+'"></i></div></div>'
      +     '<span class="k-doppel"><u></u><i></i></span>'
      +   '</div>'
      + '</div>';

    // Unteraufgaben — nur bei bestehenden Tickets, sonst fehlt die ticket_id
    if (t){
      var st = subStats(t);
      html += '<div class="f-label">Unteraufgaben' + (st.total ? ' · ' + st.done + '/' + st.total : '') + '</div>'
            + '<div id="dSubs"></div>'
            + '<div class="sub-neu"><input id="dSubNeu" placeholder="Unteraufgabe hinzufügen" autocomplete="off">'
            + '<button id="dSubAdd" aria-label="Hinzufügen">+</button></div>';
    }

    html += '<div class="f-label">Beschreibung</div><div id="dDescWrap"><div id="dDesc"></div></div>';

    if (t){
      html += '<div class="f-label">Kommentare</div><div id="dComments">'
        + ((t.comments||[]).length
            ? t.comments.map(function(c){
                return '<div class="cmt"><div class="when">'+esc(fmtWhen(c.ts))+'</div>'
                     + '<div class="md">'+mdToHtml(c.text)+'</div></div>';
              }).join("")
            : "")
        + '</div>'
        + '<div class="cmt-box"><div id="dCmt"></div>'
        + '<button class="wide" id="dCmtSend" disabled>Kommentar senden</button></div>'
        + '<button class="wide done" id="dDone">Als erledigt markieren</button>'
        + '<button class="wide del" id="dDel">Ticket löschen</button>';
    }
    $("dBody").innerHTML = html;
    wireDetail();
  }

  function autoGrow(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

  function wireDetail(){
    var ta = $("dTitle");
    autoGrow(ta);
    ta.addEventListener("input", function(){ draft.title = ta.value.replace(/\n/g,""); autoGrow(ta); });
    ta.addEventListener("keydown", function(e){ if (e.key === "Enter") e.preventDefault(); });

    if ($("dSubs")) wireSubs();

    var desc = $("dDesc");
    initRTE(desc, { placeholder:"Beschreibung … („- " + "␣" + "\" wird zur Aufzählung)" });
    rteSet(desc, draft.description);

    $("dStatus").addEventListener("click", function(){
      syncEditors();
      statusSheet(draft.status, function(s){ draft.status = s; renderDetail(); });
    });
    $("dDate").addEventListener("click", function(){
      syncEditors();
      dateSheet(draft.dueDate, function(v){ draft.dueDate = v; renderDetail(); });
    });

    $("dTagsBtn").addEventListener("click", function(){ syncEditors(); tagSheet(); });

    if ($("dCmt")){
      var cm = $("dCmt");
      initRTE(cm, { small:true, placeholder:"Kommentar …", onInput:function(){
        $("dCmtSend").disabled = !cm.textContent.trim();
      }});
      rteSet(cm, draft.comment);
      $("dCmtSend").disabled = !cm.textContent.trim();
      $("dCmtSend").addEventListener("click", sendComment);
      $("dDone").addEventListener("click", function(){
        var id = editing.id; closeDetail(); completeTicket(id);
      });
      $("dDel").addEventListener("click", deleteTicket);
    }
  }

  /* =====================================================================
     Unteraufgaben — eigene Tabelle im Sheet, gleiche Daten wie im Desktop.
     Geschrieben wird ueber die Warteschlange, die Anzeige aendert sich sofort.
     ===================================================================== */
  function subsZeichnen(){
    var box = $("dSubs"); if (!box || !editing) return;
    var liste = subListe(editing);
    if (subtasksFehlt){
      box.innerHTML = '<div class="sub-hinweis">Der Tab <b>Subtasks</b> fehlt im Google Sheet.</div>';
      return;
    }
    box.innerHTML = liste.length ? liste.map(function(s){
      return '<div class="sub' + (s.done ? ' fertig' : '') + '" data-sid="' + esc(s.subtask_id) + '">'
           + '<button class="sub-box" aria-label="Abhaken"></button>'
           + '<span class="sub-titel">' + esc(s.title) + '</span>'
           + '<button class="sub-weg" aria-label="Löschen">✕</button>'
           + '</div>';
    }).join("") : "";

    box.querySelectorAll(".sub").forEach(function(el){
      var sid = el.dataset.sid;
      el.querySelector(".sub-box").addEventListener("click", function(){ subUmschalten(sid); });
      el.querySelector(".sub-weg").addEventListener("click", function(){ subLoeschen(sid); });
    });
    // Ueberschrift mit dem Zaehler auffrischen
    var lbl = box.previousElementSibling;
    if (lbl && lbl.classList.contains("f-label")){
      var st = subStats(editing);
      lbl.textContent = "Unteraufgaben" + (st.total ? " · " + st.done + "/" + st.total : "");
    }
  }
  function subUmschalten(sid){
    var s = subListe(editing).find(function(x){ return x.subtask_id === sid; }); if (!s) return;
    s.done = !s.done;
    s.doneAt = s.done ? Date.now() : "";
    subsZeichnen(); render();
    updateRow(TAB_SUBTASKS, "subtask_id", sid, subToRow(s, editing.id));
  }
  function subLoeschen(sid){
    var liste = subListe(editing);
    var i = liste.findIndex(function(x){ return x.subtask_id === sid; }); if (i < 0) return;
    liste.splice(i, 1);
    subsZeichnen(); render();
    deleteRows(TAB_SUBTASKS, "subtask_id", sid);
  }
  function subAnlegen(){
    var feld = $("dSubNeu"); if (!feld || !editing) return;
    var titel = feld.value.trim(); if (!titel) return;
    if (subtasksFehlt){ snack("Erst den Tab „Subtasks“ im Sheet anlegen", null, true); return; }
    var liste = (editing.subtasks = subListe(editing));
    var s = { subtask_id: uid(), title: titel, done: false, pos: subNaechstePos(liste), doneAt: "" };
    liste.push(s);
    feld.value = "";
    subsZeichnen(); render();
    appendRow(TAB_SUBTASKS, subToRow(s, editing.id));
    feld.focus();
  }
  function wireSubs(){
    subsZeichnen();
    var add = $("dSubAdd"), feld = $("dSubNeu");
    if (add) add.addEventListener("click", subAnlegen);
    if (feld) feld.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); subAnlegen(); }
    });
  }

  async function saveDetail(){
    syncEditors();
    if (!draft.title.trim()){ snack("Bitte einen Titel eingeben", null, true); return; }
    // Pflichtfelder nur beim Anlegen — bestehende Tickets ohne Tag oder Datum
    // sollen sich weiterhin bearbeiten lassen, ohne sie erst ergaenzen zu muessen.
    if (!editing){
      if (!draft.dueDate){ snack("Bitte ein Datum wählen", null, true); return; }
      if (!draft.tags.length){ snack("Bitte mindestens einen Tag wählen", null, true); return; }
    }
    var btn = $("dSave"); btn.disabled = true; btn.textContent = "Sichert…";
    try {
      if (editing){
        var prev = editing.status;
        if (draft.status === "Done"){
          // Status bewusst NICHT setzen: completeTicket braucht den bisherigen
          // Status fuer den Verlauf und fuer ein sauberes Rueckgaengig.
          Object.assign(editing, { title:draft.title.trim(), description:draft.description,
                                   dueDate:draft.dueDate, tags:draft.tags.slice() });
          var id = editing.id;
          closeDetail(); render();
          await completeTicket(id);
        } else {
          // Alten Stand merken, um bei einem Fehler sauber zurueckzurollen
          var back = { title:editing.title, description:editing.description,
                       dueDate:editing.dueDate, status:editing.status, tags:(editing.tags||[]).slice() };
          Object.assign(editing, { title:draft.title.trim(), description:draft.description,
                                   dueDate:draft.dueDate, status:draft.status, tags:draft.tags.slice() });
          try { await updateRow(TAB_TICKETS, "id", editing.id, ticketToRow(editing)); }
          catch(err){ Object.assign(editing, back); throw err; }
          if (draft.status !== prev) logActivity("status", editing, prev + " → " + draft.status);
          closeDetail(); render();
        }
      } else {
        // Erst nach der Bestaetigung von Google lokal aufnehmen, damit bei einem
        // Fehler kein Geisterticket in der Liste zurueckbleibt
        var t = { id:uid(), title:draft.title.trim(), description:draft.description,
                  dueDate:draft.dueDate, status:draft.status, tags:draft.tags.slice(),
                  priority:"", comments:[], series_id:"" };
        await appendRow(TAB_TICKETS, ticketToRow(t));
        tickets.push(t);
        logActivity("created", t, "");
        closeDetail(); render();
      }
    } catch(e){
      snack("Speichern fehlgeschlagen: " + (e.message || e), null, true);
    } finally { btn.disabled = false; btn.textContent = "Sichern"; }
  }

  async function sendComment(){
    if (!editing) return;
    var text = htmlToMd($("dCmt")).trim();
    if (!text) return;
    var btn = $("dCmtSend"); btn.disabled = true; btn.textContent = "Sendet…";
    var c = { comment_id:uid(), text:text, ts:Date.now() };
    try {
      await appendRow(TAB_COMMENTS, { comment_id:c.comment_id, ticket_id:editing.id,
                                      text:c.text, timestamp:c.ts });
      (editing.comments = editing.comments || []).unshift(c);
      draft.comment = "";
      renderDetail();
    } catch(e){
      btn.disabled = false; btn.textContent = "Kommentar senden";
      snack("Kommentar fehlgeschlagen", null, true);
    }
  }

  async function deleteTicket(){
    if (!editing) return;
    if (!confirm("Dieses Ticket wirklich löschen?")) return;
    var t = editing, idx = tickets.indexOf(t);
    tickets.splice(idx, 1);
    closeDetail(); render();
    try {
      await deleteRows(TAB_TICKETS, "id", t.id);
      await deleteRows(TAB_COMMENTS, "ticket_id", t.id);
      snack("Gelöscht");
    } catch(e){
      tickets.splice(idx, 0, t); render();
      snack("Löschen fehlgeschlagen", null, true);
    }
  }

  /* =====================================================================
     Verdrahtung
     ===================================================================== */
  /* =====================================================================
     Gesten — Druckgefuehl, Wischen, Ziehen zum Aktualisieren
     ---------------------------------------------------------------------
     Ein gemeinsamer Griff fuer alle drei: bei der ersten deutlichen
     Bewegung wird entschieden, worum es geht, und dabei bleibt es bis zum
     Loslassen. Sonst zappelt die Zeile beim Scrollen.
     ===================================================================== */
  (function(){
    var SCHWELLE = 10;        // ab hier gilt die Richtung als erkannt
    var AUSLOESER = 78;       // so weit muss gewischt werden
    var ZIEH_AUS = 68;        // so weit gezogen loest Aktualisieren aus

    var x0=0, y0=0, art=null, zeile=null, karte=null, dx=0, dy=0, druckZeit=null;
    var ptr = null;           // Anzeige beim Ziehen
    // Nach einer Geste feuert der Browser noch einen Klick nach — der darf
    // nicht versehentlich das Ticket oeffnen.
    window.__gesteBis = 0;

    function ptrEl(){
      if (!ptr){
        ptr = document.createElement("div");
        ptr.id = "ptr";
        ptr.innerHTML = '<span class="ptr-kreis"></span>';
        document.body.appendChild(ptr);
      }
      return ptr;
    }
    function druckLoesen(){
      clearTimeout(druckZeit);
      if (zeile) zeile.classList.remove("gedrueckt");
    }
    function zuruecksetzen(){
      druckLoesen();
      if (karte){ karte.classList.remove("zieht"); karte.classList.add("federt"); karte.style.transform = ""; }
      if (zeile){ [].forEach.call(zeile.querySelectorAll(".swipe-bg"), function(b){ b.style.opacity = 0; }); }
      x0=y0=dx=dy=0; art=null; zeile=null; karte=null;
    }

    document.addEventListener("touchstart", function(e){
      if (e.touches.length !== 1) return;
      if (document.getElementById("detail").classList.contains("on")) return;
      if ($("sheet").classList.contains("on")) return;
      var t = e.touches[0];
      x0 = t.clientX; y0 = t.clientY; dx = dy = 0; art = null;
      zeile = e.target.closest ? e.target.closest(".swipe") : null;
      karte = zeile ? zeile.querySelector(".card") : null;
      if (karte){
        karte.classList.remove("federt");
        // Erst nach kurzer Verzoegerung tonen, sonst blitzt es beim Scrollen auf
        // Gedrueckt wird der Wischbehaelter, nicht die Flaeche: an ihm haengt
        // der Schatten, und ohne ihn bliebe der Schatten beim Druck stehen.
        druckZeit = setTimeout(function(){ if (!art) zeile.classList.add("gedrueckt"); }, 60);
      }
    }, { passive:true });

    document.addEventListener("touchmove", function(e){
      if (!e.touches.length) return;
      var t = e.touches[0];
      dx = t.clientX - x0; dy = t.clientY - y0;

      if (art === null){
        if (Math.abs(dx) < SCHWELLE && Math.abs(dy) < SCHWELLE) return;
        if (Math.abs(dx) > Math.abs(dy) * 1.3 && karte){ art = "wischen"; karte.classList.add("zieht"); }
        else if (dy > 0 && window.scrollY <= 0 && !reloading && !queue.length){ art = "ziehen"; }
        else art = "scrollen";
        druckLoesen();
      }

      if (art === "wischen"){
        e.preventDefault();
        var w = Math.sign(dx) * Math.min(Math.abs(dx), AUSLOESER + (Math.abs(dx) - AUSLOESER) * 0.35);
        if (Math.abs(dx) <= AUSLOESER) w = dx;
        karte.style.transform = "translateX(" + w + "px)";
        var bgE = zeile.querySelector(".swipe-bg.erledigt");
        var bgS = zeile.querySelector(".swipe-bg.spaeter");
        bgE.style.opacity = dx > 0 ? Math.min(1, dx / AUSLOESER) : 0;
        bgS.style.opacity = dx < 0 ? Math.min(1, -dx / AUSLOESER) : 0;
      } else if (art === "ziehen"){
        e.preventDefault();
        var z = Math.min(dy * 0.5, ZIEH_AUS + 22);
        var el = ptrEl();
        el.style.transform = "translateY(" + z + "px)";
        el.style.opacity = Math.min(1, z / ZIEH_AUS);
        el.classList.toggle("bereit", z >= ZIEH_AUS);
      }
    }, { passive:false });

    function ende(){
      if (art === "wischen" || art === "ziehen") window.__gesteBis = Date.now() + 400;
      if (art === "wischen" && karte){
        var id = zeile.dataset.id;
        if (dx >= AUSLOESER){
          var r = karte.getBoundingClientRect();
          confettiBurst(r.left + r.width * 0.35, r.top + r.height / 2);
          karte.classList.add("federt");
          karte.style.transform = "translateX(100%)";
          setTimeout(function(){ completeTicket(id); }, 120);
          druckLoesen(); x0=y0=dx=dy=0; art=null; zeile=null; karte=null;
          return;
        }
        if (dx <= -AUSLOESER){
          var t = byId(id);
          if (t){
            var vorher = t.dueDate;
            patchTicket(t, { dueDate: addDays(todayISO(), 1) });
            snack("Auf morgen verschoben", function(){ patchTicket(t, { dueDate: vorher }); });
          }
        }
      } else if (art === "ziehen"){
        var el = ptrEl();
        if (dy * 0.5 >= ZIEH_AUS){
          el.classList.add("laeuft");
          Promise.resolve(reload(true)).then(function(){
            el.style.opacity = 0; el.style.transform = "";
            el.classList.remove("laeuft","bereit");
          });
        } else {
          el.style.opacity = 0; el.style.transform = "";
          el.classList.remove("bereit");
        }
      }
      zuruecksetzen();
    }
    document.addEventListener("touchend", ende, { passive:true });
    document.addEventListener("touchcancel", zuruecksetzen, { passive:true });
  })();

  $("main").addEventListener("click", function(e){
    if (Date.now() < (window.__gesteBis||0)) return;   // Nachklapper einer Geste
    var gk = e.target.closest("[data-grp]");
    if (gk){
      grpZu[gk.dataset.grp] = !grpZu[gk.dataset.grp];
      try { localStorage.setItem("board-gruppen-zu-mobil", JSON.stringify(grpZu)); } catch(_){}
      render();
      return;
    }
    var ic = e.target.closest("[data-info]");
    if (ic){ var n = infoById(ic.dataset.info); if (n) openInfo(n); return; }
    var el = e.target.closest("[data-act]"); if (!el) return;
    var card = el.closest(".card"); if (!card) return;
    var t = byId(card.dataset.id); if (!t) return;
    var act = el.dataset.act;

    if (act === "open") openDetail(t);
    else if (act === "done"){ confettiBurst(e.clientX, e.clientY); completeTicket(t.id); }
    else if (act === "status") statusSheet(t.status, function(s){
      if (s === t.status) return;
      if (s === "Done"){ completeTicket(t.id); return; }
      patchTicket(t, { status:s }, t.status + " → " + s);
    });
    else if (act === "date") dateSheet(t.dueDate, function(v){
      if (v !== t.dueDate) patchTicket(t, { dueDate:v });
    });
  });


  // Nur Knoepfe MIT data-view schalten die Ansicht um. Das Plus in der Mitte
  // legt an — ohne diese Einschraenkung lief es in setView(undefined) und
  // leerte die Liste.
  document.querySelectorAll("nav button[data-view]").forEach(function(b){
    b.addEventListener("click", function(){ setView(b.dataset.view); });
  });
  $("dashBar").addEventListener("click", dashSheet);

  $("bSearch").addEventListener("click", function(){
    var bar = $("searchBar"), show = bar.classList.contains("hidden");
    bar.classList.toggle("hidden", !show);
    $("bSearch").classList.toggle("on", show);
    if (show) $("search").focus();
    else { $("search").value = ""; query = ""; render(); }
  });
  $("search").addEventListener("input", function(){ query = this.value; render(); });
  $("bFilter").addEventListener("click", filterSheet);
  $("bTheme").addEventListener("click", themeSheet);
  $("qBadge").addEventListener("click", warteschlangeBlatt);
  $("bReload").addEventListener("click", function(){ reload(true); });
  $("navPlus").addEventListener("click", function(){
    if (view === "infos"){ if (infosOk) openInfo(null); else snack("Erst den Tab „Infos“ im Sheet anlegen", null, true); }
    else openDetail(null);
  });
  // Die beiden Kopfknoepfe bedienen je nach Modus das Ticket- oder das Info-Detail
  $("dClose").addEventListener("click", function(){
    if (!infoMode) return closeDetail();
    if (infoMode === "edit" && infoEditing){ infoMode = "read"; renderInfoDetail(); }
    else closeInfo();
  });
  $("dSave").addEventListener("click", function(){
    if (!infoMode) return saveDetail();
    if (infoMode === "read"){ infoMode = "edit"; renderInfoDetail(); }
    else saveInfo();
  });

  /* Beim Zurueckkehren zur App auffrischen — aber nicht bei jedem kurzen
     Wechsel, sonst laeuft staendig ein kompletter Ladevorgang. */
  document.addEventListener("visibilitychange", function(){
    if (document.hidden || !loaded || editing || infoMode) return;
    if (Date.now() - lastLoadOk < 90000) return;
    reload(true);
  });

  /* Beim Start zuerst nachholen, was beim letzten Mal nicht mehr rausging */
  queueAnzeige();
  queueRun();

  /* Erst den letzten bekannten Stand zeigen, dann im Hintergrund holen */
  if (cacheLoad()){
    loaded = true;
    render();
    // Nur melden, wenn der gespeicherte Stand wirklich alt ist
    if (cacheTs && Date.now() - cacheTs > 1800000) snack("Stand von " + fmtWhen(cacheTs) + " — wird aktualisiert…");
  }
  reload(true);
})();
</script>
</body>
</html>
